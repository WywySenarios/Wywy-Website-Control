# secrets-scan.yml — Gitleaks secrets scan (CI workflow template)
#
# Copy this file to .github/workflows/secrets-scan.yml in any repo that
# should be protected against secret leaks.
#
# The workflow expects a .gitleaks.toml config at the repo root.
# If none exists, gitleaks uses its built-in default rules.

name: secrets-scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  scan:
    name: Gitleaks
    runs-on: [wywy]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
