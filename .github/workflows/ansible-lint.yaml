name: ansible-lint

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  ansible:
    name: Ansible lint + syntax-check
    runs-on: [wywy]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install system prerequisites
        run: sudo apt-get update && sudo apt-get install -y python3 python3-venv bats jq
      - name: Install pinned uv
        env:
          UV_VERSION: "0.11.28"
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -LsSf -o /tmp/uv.tar.gz \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/uv.tar.gz -C /tmp
          install -m 0755 /tmp/uv-x86_64-unknown-linux-gnu/uv "$HOME/.local/bin/uv"
          rm -rf /tmp/uv.tar.gz /tmp/uv-x86_64-unknown-linux-gnu
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install the ansible toolchain
        run: scripts/install/ansible.sh
      - name: Run ansible suite
        run: |
          for step in scripts/tests/ansible/*.sh; do
            "$step"
          done
