# Template wpa_supplicant configuration.
#
# build-proxmox-iso.sh reads this template, substitutes the WiFi SSID and
# password (prompted interactively when --interface names a wlp* device),
# and writes the result to the ISO as wpa_supplicant-<iface>.conf.
#
# The active .conf is what copy-files.sh installs onto the target at
# /etc/wpa_supplicant/wpa_supplicant-<iface>.conf.

ctrl_interface=DIR=/var/run/wpa_supplicant GROUP=netdev
update_config=1
country=US

network={
	ssid="<wifissid>"
	psk="<wifipsk>"
}
