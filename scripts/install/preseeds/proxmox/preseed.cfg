# Proxmox VE node preseed for a Kubernetes host
###############################################################################
# Based on: https://github.com/Momi-V/Proxmox-Install/blob/main/preseed.cfg
# Target: Debian Trixie → Proxmox VE 9.x, KVM host for K8s VMs
#       - deb.debian.org mirror (standard Debian CDN)
#       - Non-root user with sudo; root locked (no password)
#       - System timezone is UTC
#       - US locale
#       - Networking is NOT pre-configured — the on-site admin handles it
#       - Password is prompted during installation (not baked into the ISO)
###############################################################################
#
# ╔═══════════════════════════════════════════════════════════════════════╗
# ║   NOTES                                                               ║
# ╚═══════════════════════════════════════════════════════════════════════╝
#
# This preseed is primarily used via build-proxmox-iso.sh, which populates
# template tags automatically:
#
#       --hostname <name>    →  replaces <hostname>
#       --target-disk <path> →  replaces <target_disk> (default: /dev/nvme0n1)
#                                Examples: /dev/nvme1n1, /dev/sda, /dev/vda
#       --no-partition       →  removes the entire partitioning block
#                                (partition manually during install)
#       ssh_key paths...     →  injected as authorized_keys on the ISO
#
# The build script:
#   - Sets root-login to false (root stays locked, no prompt)
#   - Does NOT configure networking (done on-site by the admin)
#   - Does NOT set a password (prompted during installation)
#
# To use this preseed manually: replace every <tag> below with your values,
# place the file on installer media, and append to kernel params:
#       preseed/file=/cdrom/preseed.cfg auto=true
#
###############################################################################

### Localization
d-i debian-installer/locale string en_US
d-i keyboard-configuration/xkb-keymap select us

### Network configuration
# Networking is pre-configured by the build script from --interface.
# The installer will use the specified interface (DHCP for package download
# during installation).  For wireless (wlp*) interfaces the SSID and PSK
# are also substituted at build time.

# Hostname and domain
d-i netcfg/get_hostname string <hostname>
d-i netcfg/get_domain string wywy
# d-i netcfg/hostname string <hostname>

d-i netcfg/choose_interface string <netiface>

# WiFi credentials - uncommented by build-proxmox-iso.sh when --interface is wlp*
# d-i netcfg/wireless_essid string <wifissid>
# d-i netcfg/wireless_wpa string <wifipsk>

# --- Static IP configuration (uncomment and adjust for no-DHCP environments) ---
# d-i netcfg/disable_autoconfig boolean true
# d-i netcfg/disable_dhcp boolean true
# d-i netcfg/get_ipaddress string 192.168.1.100
# d-i netcfg/get_netmask string 255.255.255.0
# d-i netcfg/get_gateway string 192.168.1.1
# d-i netcfg/get_nameservers string 192.168.1.1
# d-i netcfg/confirm_static boolean true

### Non-free firmware
# Allow loading non-free firmware (required for WiFi chipsets).
# Firmware is included in the non-free section of the Debian mirror.
d-i hw-detect/load_firmware boolean true

### Mirror settings — public Debian CDN (deb.debian.org)
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Account setup
# Create a non-root user with sudo; leave root locked (no password set).
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Wywy Admin
d-i passwd/username string wywy

# Password is NOT set here — the on-site admin enters it during installation.
# Commented out so the installer prompts interactively.
# d-i passwd/user-password password <password>
# d-i passwd/user-password-again password <password>

# Root password — intentionally left unset (root stays locked).
# Explicitly disable root login
d-i passwd/root-login boolean false

### Clock and time zone
d-i clock-setup/utc boolean true
d-i time/zone string UTC

# NTP
d-i clock-setup/ntp boolean true

### BEGIN PARTITION BLOCK
### Partitioning — GPT + EFI + LVM + btrfs @root
# Set --target-disk on the build script to target a specific device, e.g.
#   --target-disk /dev/sda
# Default: /dev/nvme0n1 (change via flag for other hardware).
# Pass --no-partition to remove this entire block (manual partitioning).
d-i partman-auto/disk string <target_disk>
d-i partman-auto/method string lvm
d-i partman-auto-lvm/guided_size string max
d-i partman-auto-lvm/no_boot boolean true
d-i partman-basicfilesystems/no_swap boolean false

d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true

# Recipe: EFI partition + LVM VG "system" + btrfs LV "root" at /
d-i partman-auto/expert_recipe string			\
	efi-root ::						\
								\
		100 1000 100 free				\
			$iflabel{ gpt }				\
			$reusemethod{ }				\
			method{ efi }				\
			format{ } .				\
								\
		1000 10000 -1 free				\
			$defaultignore{ }			\
			$primary{ }				\
			method{ lvm }				\
			vg_name{ system } .			\
								\
		1000 10000 -1 btrfs				\
			$lvmok{ }				\
			in_vg{ system }				\
			lv_name{ root }				\
			method{ format }			\
			format{ }				\
			use_filesystem{ }			\
			filesystem{ btrfs }			\
			mountpoint{ / } .

d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Force UEFI + GPT
d-i partman-efi/non_efi_system boolean true
d-i partman-partitioning/choose_label select gpt
d-i partman-partitioning/default_label string gpt
### END PARTITION BLOCK

### Apt setup
# You can choose to install non-free firmware.
#d-i apt-setup/non-free-firmware boolean true
# You can choose to install non-free and contrib software.
#d-i apt-setup/non-free boolean true
#d-i apt-setup/contrib boolean true
# Uncomment the following line, if you don't want to have the sources.list
# entry for a DVD/BD installation image active in the installed system
# (entries for netinst or CD images will be disabled anyway, regardless of
# this setting).
#d-i apt-setup/disable-cdrom-entries boolean true

d-i apt-setup/use_mirror boolean true
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/security_host string security.debian.org

### Package selection
tasksel tasksel/first multiselect standard
d-i apt-setup/cdrom/set-first boolean false

# Packages to install: curl/gnupg for local key management,
# ifupdown2 for networking, openssh-server for remote access.
# <extrapackages> is substituted at build time by build-proxmox-iso.sh.
# For wireless (wlp*) interfaces it includes: wpasupplicant isc-dhcp-client
# For wired interfaces it includes:         isc-dhcp-client
d-i pkgsel/include string <extrapackages>
popularity-contest popularity-contest/participate boolean false

### Boot loader
# GRUB install target: matches --target-disk flag, or 'default' (auto-detect)
# when the flag is omitted. 'default' installs GRUB to the same device
# as the EFI System Partition.
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string <target_disk>

### Finishing up
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean true

### --- LATE COMMAND ---
# Three-phase post-install setup:
#
# Phase 1 — copy-files.sh (sh, outside chroot):
#   Copies configuration files from /cdrom to /target.  Also stages
#   late-command.sh into /target/root/ for the next phase.
#
# Phase 2 — late-command.sh (sh, inside chroot):
#   Installs packages (GPG key, apt operations).  Invoked via chroot
#   rather than piping, since pipe-through-stdin does not work reliably.
#
# Phase 3 — cleanup.sh (sh, outside chroot):
#   Removes staged artifacts and restores any config files touched
#   during installation.
#
# All three phases append to the same log file.

d-i preseed/late_command string \
  cat /cdrom/copy-files.sh | sh -s >> /target/var/log/preseed-late-command.log 2>&1 && \
  chroot /target sh /root/late-command.sh >> /target/var/log/preseed-late-command.log 2>&1 && \
  cat /cdrom/cleanup.sh | sh -s >> /target/var/log/preseed-late-command.log 2>&1