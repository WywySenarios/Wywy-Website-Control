# Argo CD Helm values — SOPS/age decryption support for repo-server.
#
# Consumed by scripts/install/k8s/argocd.sh via --values.
#
# The argocd-age-key Secret itself (the age private key) is created
# cluster-locally and is NEVER committed to git — only the wiring below is.
#
# KSOPS (kustomize-sops, https://github.com/viaduct-ai/kustomize-sops) is
# installed into the repo-server at pod start by an init container that
# copies the ksops + kustomize binaries from the viaductoss/ksops image.

configs:
  # Helm repositories consumed by Applications.
  repositories:
    csi-driver-nfs:
      name: csi-driver-nfs
      url: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
      type: helm
    immich-charts:
      name: immich-charts
      url: ghcr.io/immich-app/immich-charts
      type: helm
      # The argo-cd chart base64-encodes every value, so this must be a string.
      enableOCI: "true"
    jellyfin:
      name: jellyfin
      url: https://jellyfin.github.io/jellyfin-helm
      type: helm
    prometheus-community:
      name: prometheus-community
      url: https://prometheus-community.github.io/helm-charts
      type: helm

  cm:
    # Enable kustomize KRM exec plugins — required for the ksops generator.
    kustomize.buildOptions: "--enable-alpha-plugins --enable-exec"

server:
  livenessProbe:
    timeoutSeconds: 10
    failureThreshold: 6
  readinessProbe:
    timeoutSeconds: 10
    failureThreshold: 6

repoServer:
  livenessProbe:
    timeoutSeconds: 10
    failureThreshold: 6
  readinessProbe:
    timeoutSeconds: 10
    failureThreshold: 6
  volumes:
    - name: argocd-age-key
      secret:
        secretName: argocd-age-key
    - name: custom-tools
      emptyDir: {}
  initContainers:
    - name: install-ksops
      image: viaductoss/ksops:v4.5.1
      command:
        ["/usr/local/bin/ksops", "install", "--with-kustomize", "/custom-tools"]
      volumeMounts:
        - mountPath: /custom-tools
          name: custom-tools
  volumeMounts:
    - name: argocd-age-key
      mountPath: /home/argocd/.config/sops/age
      readOnly: true
    - name: custom-tools
      mountPath: /usr/local/bin/kustomize
      subPath: kustomize
    - name: custom-tools
      mountPath: /usr/local/bin/ksops
      subPath: ksops
