apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

resources:
  - ../../base/argocd-mcp
  - secrets

components:
  - ../../base/argocd-mcp/component

configMapGenerator:
  - name: argocd-mcp-host
    options:
      disableNameSuffixHash: true
    literals:
      - hostname=argocd-mcp-dev.ericzhu.me
