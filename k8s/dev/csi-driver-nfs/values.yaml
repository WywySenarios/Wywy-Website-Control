storageClasses:
  - name: nfs-immich
    parameters:
      server: files.internal
      share: /srv/nfs/immich
    reclaimPolicy: Retain
    volumeBindingMode: Immediate
    mountOptions:
      - nfsvers=4.1
  - name: nfs-jenkins
    parameters:
      server: files.internal
      share: /srv/nfs/jenkins
    reclaimPolicy: Retain
    volumeBindingMode: Immediate
    mountOptions:
      - nfsvers=4.1
