storageClasses:
  - name: nfs-immich
    parameters:
      server: files.internal
      share: /srv/nfs/immich
    reclaimPolicy: Retain
    volumeBindingMode: Immediate
    mountOptions:
      - nfsvers=4.1
  - name: nfs-jenkins
    parameters:
      server: files.internal
      share: /srv/nfs/jenkins
    reclaimPolicy: Retain
    volumeBindingMode: Immediate
    mountOptions:
      - nfsvers=4.1
  - name: nfs-jellyfin
    parameters:
      server: files.internal
      share: /srv/nfs/jellyfin
      subDir: media
    reclaimPolicy: Retain
    volumeBindingMode: Immediate
    mountOptions:
      - nfsvers=4.1
  - name: nfs-jellyfin-config
    parameters:
      server: files.internal
      share: /srv/nfs/jellyfin
      subDir: config
    reclaimPolicy: Retain
    volumeBindingMode: Immediate
    mountOptions:
      - nfsvers=4.1
  - name: nfs-vaultwarden
    parameters:
      server: files.internal
      share: /srv/nfs/vaultwarden
    reclaimPolicy: Retain
    volumeBindingMode: Immediate
    mountOptions:
      - nfsvers=4.1
  - name: nfs-nextcloud
    parameters:
      server: files.internal
      share: /srv/nfs/nextcloud
