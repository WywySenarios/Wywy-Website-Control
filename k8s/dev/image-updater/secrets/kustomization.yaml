apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# SOPS-encrypted Secret manifests, decrypted by the ksops kustomize generator
# (KSOPS — installed in the ArgoCD repo-server via the install-ksops init
# container). Do not commit the decrypted content.
generators:
  - ksops-generator.yaml
