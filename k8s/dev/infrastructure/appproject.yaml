apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: wywy-dev
  namespace: argocd
spec:
  description: Wywy dev-cluster GitOps project (control repo + service repos, dev cluster only)
  # Dev policy per k8s-tooling-plan: manual/managed sync, no selfHeal.
  # Prod will get a separate wywy-prod project with selfHeal=true.
  sourceRepos:
    - https://github.com/WywySenarios/Wywy-Website-Control.git
    - https://github.com/WywySenarios/Wywy-Website-Master-Database.git
    - https://github.com/WywySenarios/wywy-config.git
    - https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
  destinations:
    - server: https://kubernetes.default.svc
      name: in-cluster
      namespace: "*"
  # clusterResourceWhitelist, required for the app-of-apps tree:
  #   Namespace (REQUIRED) — every Application uses CreateNamespace=true and
  #     ArgoCD's sync context appends a PreSync Namespace task that runs through
  #     the SAME project permission validator; without Namespace whitelisted,
  #     any first sync into a new namespace fails PermissionDenied.
  #   rbac ClusterRole/ClusterRoleBinding (REQUIRED) — Image Updater's
  #     cluster-scoped RBAC; without them dev-image-updater's sync fails.
  #   argoproj.io Application/AppProject (defense-in-depth) — Application and
  #     AppProject are NAMESPACED-scope CRDs under ArgoCD 2.x, so an empty
  #     whitelist does NOT deny them; whitelisted for future-proofing.
  #   storage.k8s.io CSIDriver/StorageClass (REQUIRED)
  # Security trade-off (accepted for dev): any Application in wywy-dev can
  # create Namespaces/ClusterRoles/ClusterRoleBindings/CSIDrivers/
  # StorageClasses. Revisit for prod's separate project.
  clusterResourceWhitelist:
    - group: argoproj.io
      kind: Application
    - group: argoproj.io
      kind: AppProject
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: storage.k8s.io
      kind: CSIDriver
    - group: storage.k8s.io
      kind: StorageClass
  roles: []
