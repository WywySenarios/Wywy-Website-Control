apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-csi-driver-nfs
  namespace: argocd
  finalizers:
    - resources-finalizer.argoproj.io
spec:
  project: wywy-dev
  sources:
    - repoURL: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
      chart: csi-driver-nfs
      targetRevision: 4.13.5
      helm:
        releaseName: csi-driver-nfs
        valueFiles:
          - $values/k8s/dev/csi-driver-nfs/values.yaml
    - repoURL: https://github.com/WywySenarios/Wywy-Website-Control.git
      targetRevision: dev
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
