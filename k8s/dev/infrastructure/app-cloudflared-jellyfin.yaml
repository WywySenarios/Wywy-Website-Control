apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-cloudflared-jellyfin
  namespace: argocd
  finalizers:
    - resources-finalizer.argoproj.io
spec:
  project: wywy-dev
  source:
    repoURL: https://github.com/WywySenarios/Wywy-Website-Control.git
    targetRevision: main
    path: k8s/dev/cloudflared/jellyfin
  destination:
    server: https://kubernetes.default.svc
    namespace: jellyfin
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
