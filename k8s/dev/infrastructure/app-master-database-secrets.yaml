apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-master-database-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argoproj.io
spec:
  project: wywy-dev
  source:
    repoURL: https://github.com/WywySenarios/Wywy-Website-Control.git
    targetRevision: main
    path: k8s/dev/master-database/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: master-database
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
  # Single-owner rule: these Secret names in the master-database namespace are
  # rendered ONLY here (control repo). dev-master-database (the service app)
  # references them by name; if it ever renders the same Secret, the two apps
  # will fight each sync — never add secrets to the service repo again.
