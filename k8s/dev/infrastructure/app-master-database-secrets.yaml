apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-master-database-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argoproj.io
spec:
  project: wywy-dev
  source:
    repoURL: https://github.com/WywySenarios/Wywy-Website-Control.git
    targetRevision: main
    path: k8s/dev/master-database/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: master-database
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
