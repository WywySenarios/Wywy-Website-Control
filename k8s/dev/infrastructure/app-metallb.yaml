apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-metallb
  namespace: argocd
  finalizers:
    - resources-finalizer.argoproj.io
spec:
  project: wywy-dev
  sources:
    - repoURL: https://metallb.github.io/metallb
      chart: metallb
      targetRevision: 0.16.1
      helm:
        releaseName: metallb
        values: |
          # FRR-k8s is not used; L2 mode only.
          frrk8s:
            enabled: false
          crds:
            enabled: true
    - repoURL: https://github.com/WywySenarios/Wywy-Website-Control.git
      targetRevision: dev
      path: k8s/dev/metallb
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
