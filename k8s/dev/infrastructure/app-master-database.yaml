apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-master-database
  namespace: argocd
  finalizers:
    - resources-finalizer.argoproj.io
  annotations:
    argocd.image-updater.argoproj.io/image-list: sql-receptionist=docker-registry.github-runner:5000/master-db/sql-receptionist,create_tables=docker-registry.github-runner:5000/master-db/create_tables
    argocd.image-updater.argoproj.io/update-strategy: newest-build
    argocd.image-updater.argoproj.io/write-back-method: argocd
spec:
  project: wywy-dev
  source:
    repoURL: https://github.com/WywySenarios/Wywy-Website-Master-Database.git
    targetRevision: main
    path: k8s/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: master-database
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
