apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: github-runner

resources:
  - ../../base/docker-registry
  - ../secrets

# Dev-specific patches (storageClass, nodeSelector, resources, image tags)
# go here when dev diverges from the shared base. Currently none — dev == base.
#
# Secrets are ArgoCD-managed: SOPS-encrypted manifests in k8s/dev/secrets/,
# decrypted by the ksops kustomize generator during repo-server builds.
