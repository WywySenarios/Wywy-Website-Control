apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: jenkins
resources:
  - ../../base/jenkins
  - ../base/registry-endpoint
  - public-url.yaml
  - secrets
replacements:
  - source:
      kind: ConfigMap
      name: registry-endpoint
      fieldPath: data.ip
    targets:
      - select:
          kind: NetworkPolicy
          name: jenkins-agent
        fieldPaths:
          - spec.egress.2.to.0.ipBlock.cidr
