apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
nameSuffix: -control-generic
resources:
  - ../base/generic
patches:
  - target:
      group: keda.sh
      version: v1alpha1
      kind: ScaledObject
      name: github-runner
    patch: |-
      - op: replace
        path: /spec/scaleTargetRef/name
        value: github-runner-control-generic
      - op: replace
        path: /spec/triggers/0/authenticationRef/name
        value: github-runner-auth-control-generic

# No REPO_URL patch — base defaults to the control repo values.
