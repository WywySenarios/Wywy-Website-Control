apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
nameSuffix: -master-db-dind
resources:
  - ../base/dind
patches:
  - path: patches.yaml
  - target:
      group: keda.sh
      version: v1alpha1
      kind: ScaledObject
      name: github-runner
    patch: |-
      - op: replace
        path: /spec/scaleTargetRef/name
        value: github-runner-master-db-dind
      - op: replace
        path: /spec/triggers/0/metadata/repos
        value: Wywy-Website-Master-Database
      - op: replace
        path: /spec/triggers/0/authenticationRef/name
        value: github-runner-auth-master-db-dind
