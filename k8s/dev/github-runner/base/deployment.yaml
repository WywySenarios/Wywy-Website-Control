apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-runner
  labels:
    app: github-runner
spec:
  replicas: 0
  selector:
    matchLabels:
      app: github-runner
  template:
    metadata:
      labels:
        app: github-runner
    spec:
      containers:
        # ──────────────────────────────────────────────────────────────────
        # GitHub Actions self-hosted runner (myoung34)
        # ──────────────────────────────────────────────────────────────────
        - name: runner
          image: myoung34/github-runner:latest
          env:
            - name: RUNNER_SCOPE
              value: "repo"
            - name: REPO_URL
              value: "https://github.com/WywySenarios/Wywy-Website-Control"
            - name: ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-runner-pat
                  key: token
            - name: RUNNER_LABELS
              value: "self-hosted,wywy"
            - name: DOCKER_HOST
              value: "tcp://127.0.0.1:2375"
            - name: DOCKER_TLS_VERIFY
              value: ""
            - name: EPHEMERAL
              value: "true"
            - name: DISABLE_AUTO_UPDATE
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 512Mi

        # ──────────────────────────────────────────────────────────────────
        # Docker daemon sidecar
        # ──────────────────────────────────────────────────────────────────
        # Binds to 127.0.0.1:2375 (loopback only) — not reachable from
        # outside the pod.  Resource limits prevent a single job from
        # exhausting the node (disk, memory, CPU).  The emptyDir for
        # /var/lib/docker is deleted when the pod scales to zero.
        - name: dind
          image: docker:dind
          command:
            - dockerd
            - --host=unix:///var/run/docker.sock
            - --host=tcp://127.0.0.1:2375
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 2Gi
              ephemeral-storage: 10Gi
          volumeMounts:
            - name: docker-data
              mountPath: /var/lib/docker

      imagePullSecrets:
        - name: regcred-ghcr
      volumes:
        - name: docker-data
          emptyDir:
            sizeLimit: 10Gi
