apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - registry-egress.yaml

replacements:
  - source:
      kind: ConfigMap
      name: registry-endpoint
      fieldPath: data.ip
    targets:
      - select:
          kind: NetworkPolicy
          name: github-runner-registry-egress
        fieldPaths:
          - spec.egress.0.to.0.ipBlock.cidr
