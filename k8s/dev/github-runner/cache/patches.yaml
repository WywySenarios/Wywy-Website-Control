apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-runner
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: github-runner-cache
  template:
    metadata:
      labels:
        app: github-runner
        app.kubernetes.io/name: github-runner-cache
    spec:
      containers:
        - name: runner
          env:
            - name: REPO_URL
              value: https://github.com/WywySenarios/Wywy-Website-Cache
            - name: RUNNER_LABELS
              value: self-hosted,wywy,dind
