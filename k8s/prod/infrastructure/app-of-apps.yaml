apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-app-of-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argoproj.io
spec:
  project: wywy-prod
  source:
    repoURL: https://github.com/WywySenarios/Wywy-Website-Control.git
    targetRevision: main
    path: k8s/prod/infrastructure
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # Root syncs must never revert Image Updater's write-back overrides on child Applications (spec.source.kustomize.images).
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /spec/source/kustomize/images
