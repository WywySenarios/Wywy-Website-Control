apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: wywy-prod
  namespace: argocd
spec:
  description: Wywy prod-cluster GitOps project (control repo + service repos, prod cluster only)
  sourceRepos:
    - https://github.com/WywySenarios/Wywy-Website-Control.git
    - https://github.com/WywySenarios/Wywy-Website-Master-Database.git
    - https://github.com/WywySenarios/wywy-config.git
    - https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
  destinations:
    - server: https://kubernetes.default.svc
      name: in-cluster
      namespace: "*"
  clusterResourceWhitelist:
    - group: argoproj.io
      kind: Application
    - group: argoproj.io
      kind: AppProject
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: storage.k8s.io
      kind: CSIDriver
    - group: storage.k8s.io
      kind: StorageClass
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
  roles: []
