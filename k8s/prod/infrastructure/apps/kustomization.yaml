apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/infrastructure/apps

namePrefix: prod-

patches:
  - target:
      kind: Application
      name: metallb
    patch: |-
      - op: replace
        path: /spec/sources/1/path
        value: k8s/prod/metallb
