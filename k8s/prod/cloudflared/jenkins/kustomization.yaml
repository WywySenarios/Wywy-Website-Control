apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: jenkins

resources:
  - ../../../base/cloudflared
  - secrets

# The namespace hosts agent pods as well as the controller, so narrow the
# base same-namespace egress rule to the controller on its HTTP port.
patches:
  - target:
      kind: NetworkPolicy
      name: cloudflared
    patch: |-
      - op: replace
        path: /spec/egress/2
        value:
          to:
            - podSelector:
                matchLabels:
                  app: jenkins-controller
          ports:
            - protocol: TCP
              port: 8080
