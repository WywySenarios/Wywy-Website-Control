apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - ../cloudflared

# narrow the base namespace egress rule to two HTTP ports.
patches:
  - target:
      kind: NetworkPolicy
      name: cloudflared
    patch: |-
      - op: replace
        path: /spec/egress/2
        value:
          to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: argocd-server
            - podSelector:
                matchLabels:
                  app: argocd-mcp
          ports:
            - protocol: TCP
              port: 8080
            - protocol: TCP
              port: 3000

  # Run both cloudflared instances in the same pod so the NetworkPolicy and pod labels apply to both.
  - target:
      kind: Deployment
      name: cloudflared
    patch: |-
      - op: add
        path: /spec/template/spec/containers/-
        value:
          name: cloudflared-mcp
          image: cloudflare/cloudflared:2026.10.2
          imagePullPolicy: IfNotPresent
          args:
            - tunnel
            - --metrics
            - 0.0.0.0:2001
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-tunnel-token-argocd-mcp
                  key: TUNNEL_TOKEN
          ports:
            - name: metrics-mcp
              containerPort: 2001
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics-mcp
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics-mcp
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
