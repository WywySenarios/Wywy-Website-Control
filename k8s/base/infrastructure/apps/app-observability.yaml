apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
  finalizers:
    - resources-finalizer.argoproj.io
spec:
  project: wywy-prod
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.8.0
      helm:
        releaseName: prometheus-stack
        valueFiles:
          - $values/k8s/base/observability/values.yaml
    - repoURL: https://github.com/WywySenarios/Wywy-Website-Control.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/WywySenarios/Wywy-Website-Control.git
      targetRevision: main
      path: k8s/prod/observability/secrets
    - repoURL: https://github.com/WywySenarios/Wywy-Website-Control.git
      targetRevision: main
      path: k8s/prod/cloudflared/observability
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Prometheus/Alertmanager CRDs are large.
      # Server-side apply avoids the 256 KiB client-side last-applied-configuration annotation limit.
      - ServerSideApply=true
