apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: master-database
  namespace: argocd
  finalizers:
    - resources-finalizer.argoproj.io
  annotations:
    argocd.image-updater.argoproj.io/image-list: sql-receptionist=ghcr.io/wywysenarios/master-db/sql-receptionist,db-migrate=ghcr.io/wywysenarios/master-db/db-migrate
    argocd.image-updater.argoproj.io/update-strategy: newest-build
    argocd.image-updater.argoproj.io/write-back-method: argocd
spec:
  project: wywy-prod
  sources:
    - repoURL: https://github.com/WywySenarios/Wywy-Website-Master-Database.git
      targetRevision: main
      path: k8s/prod
    - repoURL: https://github.com/WywySenarios/wywy-config.git
      targetRevision: v1.0.0
      path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: master-database
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
