apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: argocd
  finalizers:
    - resources-finalizer.argoproj.io
spec:
  project: wywy-prod
  sources:
    - repoURL: https://jellyfin.github.io/jellyfin-helm
      chart: jellyfin
      targetRevision: 3.2.0
      helm:
        releaseName: jellyfin
        valueFiles:
          - $values/k8s/base/jellyfin/values.yaml
    - repoURL: https://github.com/WywySenarios/Wywy-Website-Control.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/WywySenarios/Wywy-Website-Control.git
      targetRevision: main
      path: k8s/prod/cloudflared/jellyfin
  destination:
    server: https://kubernetes.default.svc
    namespace: jellyfin
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
