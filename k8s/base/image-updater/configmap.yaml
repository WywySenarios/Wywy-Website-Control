# argocd-image-updater-config — v0.17.0 (annotation/config-map model is 0.x-only).
# The base carries an EMPTY registries placeholder; the env overlay patches in
# the full registries.conf (dev-only registry URL + secret reference) so the
# base stays env-agnostic.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-image-updater-config
  labels:
    app.kubernetes.io/name: argocd-image-updater-config
    app.kubernetes.io/part-of: argocd-image-updater
data:
  registries.conf: |
    registries: []
