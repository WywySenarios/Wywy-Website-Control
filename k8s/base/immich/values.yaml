---
controllers:
  main:
    containers:
      main:
        image:
          tag: v3.2.0
        env:
          DB_HOSTNAME: db.internal
          DB_USERNAME: immich
          DB_DATABASE_NAME: immich
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: immich-db-password
                key: password

immich:
  persistence:
    library:
      existingClaim: immich-library

valkey:
  enabled: true

server:
  enabled: true

machine-learning:
  enabled: true
  persistence:
    cache:
      enabled: true
      type: persistentVolumeClaim
      storageClass: nfs-immich
      accessMode: ReadWriteMany
      size: 10Gi
