apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins
  labels:
    app: jenkins-controller
---
# The agent pods use a separate identity with no API permissions.
# The image pull secret is attached here so every pod template inherits it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-agent
  labels:
    app: jenkins-agent
imagePullSecrets:
  - name: regcred
