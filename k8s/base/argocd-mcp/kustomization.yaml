apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

resources:
  - deployment.yaml
  - network-policy.yaml
  - service.yaml

patches:
  - target:
      kind: Deployment
      name: argocd-mcp
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --allowed-host-header
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: argocd-mcp.invalid
