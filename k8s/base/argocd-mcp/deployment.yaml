apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-mcp
  labels:
    app: argocd-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argocd-mcp
  template:
    metadata:
      labels:
        app: argocd-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: argocd-mcp
          image: quay.io/argoprojlabs/mcp-for-argocd:v0.9.0
          imagePullPolicy: IfNotPresent
          args:
            - http
            - --bind-address
            - 0.0.0.0
            - --stateless
          env:
            - name: ARGOCD_BASE_URL
              value: http://argocd-server.argocd.svc.cluster.local
            - name: ARGOCD_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: argocd-mcp
                  key: ARGOCD_API_TOKEN
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: argocd-mcp
                  key: MCP_AUTH_TOKEN
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
