# PostgreSQL client authentication configuration for the Wywy DB VM.
#
# Deployed (and re-rendered from config/.env.network on every run) by:
#   scripts/proxmox/vm/db/update-pg-hba.sh --dev|--prod
#
# This file REPLACES /etc/postgresql/18/main/pg_hba.conf on the VM.
#
# Placeholder convention: {{NAME}} marks substitution points on rule lines
# only; renderers leave comment lines untouched. Comments reference
# placeholders as <NAME> (angle brackets), which is never substituted.
#   <K8S_WORKER_IPS>  comma-separated worker IPs, expanded to one host line
#                     each. Calico masquerades pod -> LAN traffic to the node
#                     IP (natOutgoing: true), so postgres sees the worker IP,
#                     never the pod CIDR.
#   <K8S_POD_CIDR>    pod subnet; kept as a safety net in case masquerade is
#                     ever disabled or a return route is added.

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Local socket: postgres admin via sudo -u postgres.
local   all             postgres                                peer
local   all             all                                     peer

# Localhost (tests/deployment/proxmox/db/test_smoke-auth.bats connects over loopback).
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# K8s cluster nodes (masqueraded pod traffic).
{{K8S_WORKER_IPS}}

# Pod network (direct pod-IP access; usually not seen because of masquerade).
host    all             all             {{K8S_POD_CIDR}}         scram-sha-256
