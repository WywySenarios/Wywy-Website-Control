---
control_dir: "{{ ansible_config_file | dirname | dirname }}"
wywy_env: >-
  {{ ansible_inventory_sources
     | select('search', '/(dev|prod)$')
     | map('basename')
     | first }}
secrets_dir: "{{ control_dir }}/secrets/{{ wywy_env }}"
jenkins_secrets_dir: "{{ control_dir }}/k8s/{{ wywy_env }}/jenkins/secrets"
master_database_secrets_dir: "{{ control_dir }}/k8s/{{ wywy_env }}/master-database/secrets"
immich_secrets_dir: "{{ control_dir }}/k8s/{{ wywy_env }}/immich/secrets"
vaultwarden_secrets_dir: "{{ control_dir }}/k8s/{{ wywy_env }}/vaultwarden/secrets"
nextcloud_secrets_dir: "{{ control_dir }}/k8s/{{ wywy_env }}/nextcloud/secrets"
observability_secrets_dir: "{{ control_dir }}/k8s/{{ wywy_env }}/observability/secrets"
rotate_db_followup: >-
  Apply it with `playbooks/db/seed.yaml`, then
rotate_selected_tags: "{{ ansible_run_tags | reject('equalto', 'always') | list }}"
