---
# Shared rotation tag guard. The caller sets valid_rotation_tags.
- name: Require exactly one supported rotation tag
  ansible.builtin.assert:
    that:
      - rotate_selected_tags | length == 1
      - rotate_selected_tags[0] in valid_rotation_tags
      - rotate_selected_tags[0] not in (ansible_skip_tags | default([]))
    fail_msg: >-
      Pass exactly one supported rotation tag, for example
      `--tags {{ valid_rotation_tags | first }}`. Supported tags:
      {{ valid_rotation_tags | join(', ') }}.
    quiet: true
  tags: always
