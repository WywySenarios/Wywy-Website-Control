---
# The caller may pass sops_secret_rotate_password_override when one value must
# be written to more than one target. Otherwise a fresh value is generated for
# every invocation, including every loop iteration.
- name: Generate the new secret value
  ansible.builtin.set_fact:
    sops_secret_rotate_password: >-
      {{ sops_secret_rotate_password_override
         if sops_secret_rotate_password_override is defined
         else lookup('pipe', 'openssl rand -base64 32') | trim }}
  no_log: true

- name: Store the new secret value
  ansible.builtin.include_role:
    name: sops_secret
  vars:
    sops_secret_target: "{{ sops_secret_rotate_target }}"
    sops_secret_format: yaml
    sops_secret_plaintext: >-
      {{ {'apiVersion': 'v1',
          'kind': 'Secret',
          'metadata': {'name': sops_secret_rotate_name,
                       'namespace': sops_secret_rotate_namespace},
          'type': 'Opaque',
          'stringData': dict([[sops_secret_rotate_key,
                               sops_secret_rotate_password]])}
         | to_nice_yaml }}
    sops_secret_expected: >-
      {{ {'apiVersion': 'v1',
          'kind': 'Secret',
          'metadata': {'name': sops_secret_rotate_name,
                       'namespace': sops_secret_rotate_namespace},
          'type': 'Opaque',
          'stringData': dict([[sops_secret_rotate_key,
                               sops_secret_rotate_password]])} | to_json }}
  no_log: true

- name: Report the rotated secret
  ansible.builtin.debug:
    msg: >-
      Stored a new value for {{ sops_secret_rotate_name }} in
      {{ sops_secret_rotate_target }}. {{ sops_secret_rotate_followup }}
