---
- name: Validate the sops secret inputs
  ansible.builtin.assert:
    that:
      - sops_secret_target is defined
      - sops_secret_target is match('^/')
      - sops_secret_plaintext is defined
      - sops_secret_expected is defined
      - sops_secret_expected is string
      - sops_secret_format in ['json', 'yaml']
      - sops_secret_mode is match('^0[0-7]{3}$')
    fail_msg: >-
      sops_secret_target, sops_secret_plaintext, sops_secret_expected, and
      sops_secret_format are required.
    quiet: true

- name: Refuse a target outside the control repository
  ansible.builtin.assert:
    that:
      - >-
        sops_secret_target is match(
        '^' ~ (sops_secret_control_dir | regex_escape) ~ '/(secrets|k8s)/')
    fail_msg: >-
      refusing to write {{ sops_secret_target }}; the target must be under
      {{ sops_secret_control_dir }}/secrets or {{ sops_secret_control_dir }}/k8s.
    quiet: true

- name: Check the target directory
  ansible.builtin.stat:
    path: "{{ sops_secret_target | dirname }}"
  register: sops_secret_target_dir

- name: Fail closed when the target directory is missing
  ansible.builtin.assert:
    that:
      - sops_secret_target_dir.stat.isdir | default(false)
    fail_msg: >-
      {{ sops_secret_target | dirname }} does not exist; create the
      environment's secret directory before writing
      {{ sops_secret_target }}.
    quiet: true

- name: Write the encrypted secret
  block:
    - name: Create a private staging directory beside the target
      ansible.builtin.tempfile:
        state: directory
        path: "{{ sops_secret_target | dirname }}"
        prefix: "{{ sops_secret_temp_prefix }}"
      register: sops_secret_staging

    - name: Write the plaintext object
      ansible.builtin.copy:
        content: "{{ sops_secret_plaintext }}"
        dest: "{{ sops_secret_staging.path }}/plain.{{ sops_secret_format }}"
        mode: "0600"
      no_log: true

    - name: Encrypt the object with sops
      ansible.builtin.command:
        argv:
          - sops
          - --encrypt
          - --config
          - "{{ sops_secret_control_dir }}/.sops.yaml"
          - --filename-override
          - "{{ sops_secret_target }}"
          - "{{ sops_secret_staging.path }}/plain.{{ sops_secret_format }}"
      register: sops_secret_encrypted
      changed_when: true
      no_log: true

    - name: Install the encrypted object
      ansible.builtin.copy:
        content: "{{ sops_secret_encrypted.stdout }}\n"
        dest: "{{ sops_secret_target }}"
        mode: "{{ sops_secret_mode }}"
      no_log: true

    - name: Read back the encrypted object
      ansible.builtin.command:
        argv:
          - sops
          - --decrypt
          - "{{ sops_secret_target }}"
      register: sops_secret_readback
      changed_when: false
      check_mode: false
      no_log: true
      when: sops_secret_verify | bool

    - name: Fail closed when the JSON object does not round-trip
      ansible.builtin.assert:
        that:
          - (sops_secret_readback.stdout | from_json) == (sops_secret_expected | from_json)
        fail_msg: >-
          {{ sops_secret_target }} does not decrypt to the value that was
          written.
        quiet: true
      when:
        - sops_secret_verify | bool
        - sops_secret_format == 'json'
      no_log: true

    - name: Fail closed when the YAML object does not round-trip
      ansible.builtin.assert:
        that:
          - (sops_secret_readback.stdout | from_yaml) == (sops_secret_expected | from_json)
        fail_msg: >-
          {{ sops_secret_target }} does not decrypt to the value that was
          written.
        quiet: true
      when:
        - sops_secret_verify | bool
        - sops_secret_format == 'yaml'
      no_log: true

  always:
    - name: Remove the staging directory
      ansible.builtin.file:
        path: "{{ sops_secret_staging.path }}"
        state: absent
      when:
        - sops_secret_staging is defined
        - sops_secret_staging.path is defined
