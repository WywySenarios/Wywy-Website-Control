---
- name: Check whether the encrypted token exists
  ansible.builtin.stat:
    path: "{{ proxmox_terraform_token_secret_path }}"
  register: proxmox_terraform_token_secret
  delegate_to: localhost

- name: Refuse to overwrite a missing secret for an existing token
  ansible.builtin.assert:
    that:
      - not (proxmox_terraform_token_exists | bool
        and not proxmox_terraform_token_secret.stat.exists)
    fail_msg: >-
      {{ proxmox_terraform_token_user }}!{{ proxmox_terraform_token_name }}
      exists on the cluster but {{ proxmox_terraform_token_secret_path }} is
      missing. Rotate the token with
      `playbooks/proxmox/secrets/terraform/rotate.yaml --tags terraform-token`,
      then rerun.
    quiet: true
