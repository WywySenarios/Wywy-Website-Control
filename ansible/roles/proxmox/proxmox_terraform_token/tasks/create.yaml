---
- name: Create the Terraform PVE user
  when: not proxmox_terraform_token_user_exists | bool
  ansible.builtin.raw: >-
    pveum user add {{ proxmox_terraform_token_user }}
    --comment '{{ proxmox_terraform_token_comment }}'
  changed_when: true

- name: Create the Terraform PVE role
  when: not proxmox_terraform_token_role_exists | bool
  ansible.builtin.raw: >-
    pveum role add {{ proxmox_terraform_token_role }}
    --privs '{{ proxmox_terraform_token_privileges | join(',') }}'
  changed_when: true

- name: Update the Terraform PVE role privileges
  when: proxmox_terraform_token_role_exists | bool
  ansible.builtin.raw: >-
    pveum role modify {{ proxmox_terraform_token_role }}
    --privs '{{ proxmox_terraform_token_privileges | join(',') }}'
  changed_when: true

- name: Grant the Terraform role on the cluster root
  ansible.builtin.raw: >-
    pveum acl modify /
    --users {{ proxmox_terraform_token_user }}
    --roles {{ proxmox_terraform_token_role }}
  changed_when: true

- name: Create the Terraform API token
  when: not proxmox_terraform_token_exists | bool
  ansible.builtin.raw: >-
    pveum user token add {{ proxmox_terraform_token_user }}
    {{ proxmox_terraform_token_name }} --privsep 0 --output-format json
  register: proxmox_terraform_token_create
  changed_when: true
  no_log: true

- name: Record the new Terraform API token
  when: not proxmox_terraform_token_exists | bool
  ansible.builtin.set_fact:
    proxmox_terraform_token_created: true
    proxmox_terraform_token_full: >-
      {{ proxmox_terraform_token_user }}!{{ proxmox_terraform_token_name }}={{
         (proxmox_terraform_token_create.stdout | from_json).value }}
  no_log: true
