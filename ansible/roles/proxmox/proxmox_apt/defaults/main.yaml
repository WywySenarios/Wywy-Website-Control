---
proxmox_apt_repo_uri: http://download.proxmox.com/debian/pve
proxmox_apt_repo_suite: "{{ ansible_distribution_release }}"
proxmox_apt_repo_component: pve-no-subscription
proxmox_apt_repo_keyring: /usr/share/keyrings/proxmox-archive-keyring.gpg
proxmox_apt_repo_sources: /etc/apt/sources.list.d/proxmox.sources

proxmox_apt_debian_sources: /etc/apt/sources.list.d/debian.sources

proxmox_apt_ceph_release: tentacle
proxmox_apt_ceph_uri: "http://download.proxmox.com/debian/ceph-{{ proxmox_apt_ceph_release }}"
proxmox_apt_ceph_component: no-subscription
proxmox_apt_ceph_sources: /etc/apt/sources.list.d/ceph.sources

proxmox_apt_remove_packages:
  - os-prober
