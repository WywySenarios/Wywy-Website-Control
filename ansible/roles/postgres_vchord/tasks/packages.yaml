---
- name: Install the pgvector extension package
  ansible.builtin.apt:
    name: "{{ postgres_vchord_pgvector_package }}"
    state: present
  become: true

- name: Read the available pgvector version
  community.postgresql.postgresql_query:
    query: "SELECT default_version FROM pg_available_extensions WHERE name = 'vector'"
    login_user: postgres
  become: true
  become_user: postgres
  register: postgres_vchord_pgvector
  changed_when: false

- name: Fail closed when pgvector is missing or outside Immich's range
  ansible.builtin.assert:
    that:
      - postgres_vchord_pgvector.query_result | length == 1
      - >-
        postgres_vchord_pgvector.query_result[0].default_version
        is version(postgres_vchord_pgvector_min, '>=')
      - >-
        postgres_vchord_pgvector.query_result[0].default_version
        is version(postgres_vchord_pgvector_max, '<')
    fail_msg: >-
      pgvector must be >= {{ postgres_vchord_pgvector_min }} and <
      {{ postgres_vchord_pgvector_max }}; found
      {{ postgres_vchord_pgvector.query_result
      | map(attribute='default_version') | join(', ') }}.
    quiet: true

- name: Download the pinned VectorChord package
  ansible.builtin.get_url:
    url: "{{ postgres_vchord_deb_url }}"
    dest: "{{ postgres_vchord_deb_path }}"
    checksum: "{{ postgres_vchord_deb_checksum }}"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Install the pinned VectorChord package
  ansible.builtin.apt:
    deb: "{{ postgres_vchord_deb_path }}"
  become: true

- name: Read the available VectorChord version
  community.postgresql.postgresql_query:
    query: "SELECT default_version FROM pg_available_extensions WHERE name = 'vchord'"
    login_user: postgres
  become: true
  become_user: postgres
  register: postgres_vchord_available
  changed_when: false

- name: Fail closed when the installed VectorChord is not the pinned release
  ansible.builtin.assert:
    that:
      - postgres_vchord_available.query_result | length == 1
      - >-
        postgres_vchord_available.query_result[0].default_version
        == postgres_vchord_version
    fail_msg: >-
      expected VectorChord {{ postgres_vchord_version }}, found
      {{ postgres_vchord_available.query_result
      | map(attribute='default_version') | join(', ') }}.
    quiet: true
