---
# https://github.com/openwrt-iac/uapi/blob/main/docs/installation.md
- name: Ensure the apk repositories directory exists
  ansible.builtin.raw: "mkdir -p /etc/apk/repositories.d"
  changed_when: true

- name: Trust the uapi feed key
  ansible.builtin.raw: >-
    uclient-fetch -qO /etc/apk/keys/uapi-feed.pub.pem
    https://openwrt-iac.github.io/feed/uapi-feed.pub.pem
  changed_when: true

- name: Add the uapi feed
  ansible.builtin.raw: >-
    echo 'https://openwrt-iac.github.io/feed/packages/all/uapi/packages.adb'
    > /etc/apk/repositories.d/uapi.list
  changed_when: true

- name: Update apk indexes
  ansible.builtin.raw: "apk update"
  changed_when: true

# uapi needs uhttpd-mod-ucode.
# Installing it alone can leave an older uhttpd and ucode in place, which is an ABI mismatch that crashes uhttpd at startup.
- name: Update the uhttpd and ucode stack
  ansible.builtin.raw: >-
    apk add --upgrade
    uhttpd
    uhttpd-mod-ubus
    uhttpd-mod-ucode
    ucode
    libucode20230711
  changed_when: true

- name: Check whether uapi-token is installed
  ansible.builtin.raw: "command -v uapi-token"
  register: openwrt_uapi_token_bin
  changed_when: false
  failed_when: false

- name: Install uapi
  when: openwrt_uapi_token_bin.rc != 0
  ansible.builtin.raw: "apk add uapi"
  changed_when: true

- name: Check whether the uapi uhttpd prefix exists
  ansible.builtin.raw: >-
    uci -q show uhttpd.main.ucode_prefix 2>/dev/null
    | grep -qF '/api/v3=/usr/share/uapi/main.uc'
  register: openwrt_uapi_prefix
  changed_when: false
  failed_when: false

- name: Ensure the uapi uhttpd prefix exists
  when: openwrt_uapi_prefix.rc != 0
  ansible.builtin.raw: >-
    uci add_list uhttpd.main.ucode_prefix='/api/v3=/usr/share/uapi/main.uc';
    uci commit uhttpd;
    /etc/init.d/uhttpd reload
  changed_when: true
