# Which guests may reach 5432 is enforced by the Proxmox `db` security group.
# This file only decides how a connection that arrives is authenticated.

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Local socket: postgres admin via sudo -u postgres.
local   all             postgres                                peer
local   all             all                                     peer

# Localhost
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# Remote clients
host    all             all             0.0.0.0/0               scram-sha-256
