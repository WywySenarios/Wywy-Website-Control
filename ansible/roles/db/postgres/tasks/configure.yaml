---
- name: Ensure postgresql is started and enabled
  ansible.builtin.service:
    name: "{{ postgres_service }}"
    state: started
    enabled: true
  become: true

- name: Listen on all interfaces
  ansible.builtin.lineinfile:
    path: "{{ postgres_conf_dir }}/postgresql.conf"
    regexp: '^#?listen_addresses\s*='
    line: "listen_addresses = '*'"
    state: present
  become: true
  notify: Restart postgresql

- name: Install pg_hba.conf
  ansible.builtin.copy:
    src: pg_hba.conf
    dest: "{{ postgres_conf_dir }}/pg_hba.conf"
    owner: root
    group: postgres
    mode: "0640"
  become: true
  notify: Reload postgresql

- name: Check for the in-guest firewall
  ansible.builtin.stat:
    path: /usr/sbin/ufw
  register: postgres_ufw

- name: Disable the in-guest firewall
  community.general.ufw:
    state: disabled
  become: true
  when: postgres_ufw.stat.exists

- name: Remove the in-guest firewall package
  ansible.builtin.apt:
    name: ufw
    state: absent
    purge: true
  become: true

- name: Apply pending postgres config changes before validation
  ansible.builtin.meta: flush_handlers

- name: Read pg_hba parse errors from the server
  community.postgresql.postgresql_query:
    query: "SELECT line_number || ': ' || error AS error FROM pg_hba_file_rules WHERE error IS NOT NULL"
    login_user: postgres
  become: true
  become_user: postgres
  register: postgres_hba_errors
  changed_when: false

- name: Assert the server parses pg_hba.conf without errors
  ansible.builtin.assert:
    that:
      - postgres_hba_errors.query_result | length == 0
    fail_msg: "pg_hba.conf has parse errors: {{ postgres_hba_errors.query_result }}"
    quiet: true

- name: Apply pg_hba to active database
  community.postgresql.postgresql_query:
    query: "SELECT pg_reload_conf()"
    login_user: postgres
  become: true
  become_user: postgres
  changed_when: false

- name: Read the effective listen_addresses
  community.postgresql.postgresql_query:
    query: "SHOW listen_addresses"
    login_user: postgres
  become: true
  become_user: postgres
  register: postgres_listen_addresses
  changed_when: false

- name: Assert postgres listens on all interfaces
  ansible.builtin.assert:
    that:
      - postgres_listen_addresses.query_result[0].listen_addresses == '*'
    fail_msg: >-
      listen_addresses is
      '{{ postgres_listen_addresses.query_result[0].listen_addresses }}',
      expected '*'.
    quiet: true
