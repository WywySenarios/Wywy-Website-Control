---
- name: Restart CoreDNS
  ansible.builtin.command:
    argv:
      - "{{ k8s_network_kubectl }}"
      - --kubeconfig
      - "{{ k8s_network_kubeconfig }}"
      - -n
      - "{{ k8s_network_coredns_namespace }}"
      - rollout
      - restart
      - "deployment/{{ k8s_network_coredns_deployment }}"
  changed_when: true

- name: Wait for CoreDNS to parse the configuration
  ansible.builtin.command:
    argv:
      - "{{ k8s_network_kubectl }}"
      - --kubeconfig
      - "{{ k8s_network_kubeconfig }}"
      - -n
      - "{{ k8s_network_coredns_namespace }}"
      - rollout
      - status
      - "deployment/{{ k8s_network_coredns_deployment }}"
      - --timeout=120s
  changed_when: false
