---
- name: Install Argo CD
  block:
    - name: Verify the API endpoint
      kubernetes.core.k8s_info:
        kubeconfig: "{{ k8s_platform_kubeconfig }}"
        host: "{{ k8s_platform_api_server }}"
        kind: Namespace
        name: default
      changed_when: false

    - name: Ensure the Argo CD namespace exists
      kubernetes.core.k8s:
        kubeconfig: "{{ k8s_platform_kubeconfig }}"
        host: "{{ k8s_platform_api_server }}"
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ k8s_platform_argocd_namespace }}"

    - name: Create the Argo CD age key Secret
      kubernetes.core.k8s:
        kubeconfig: "{{ k8s_platform_kubeconfig }}"
        host: "{{ k8s_platform_api_server }}"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ k8s_platform_age_secret_name }}"
            namespace: "{{ k8s_platform_argocd_namespace }}"
          type: Opaque
          stringData:
            keys.txt: "{{ lookup('file', k8s_platform_age_key_path) }}"
      no_log: true

    - name: Install or upgrade Argo CD
      kubernetes.core.helm:
        kubeconfig: "{{ k8s_platform_kubeconfig }}"
        host: "{{ k8s_platform_api_server }}"
        binary_path: "{{ k8s_platform_helm }}"
        release_name: "{{ k8s_platform_argocd_release }}"
        release_namespace: "{{ k8s_platform_argocd_namespace }}"
        chart_ref: argo-cd
        chart_repo_url: "{{ k8s_platform_helm_repo_url }}"
        chart_version: "{{ k8s_platform_argocd_chart_version }}"
        values_files:
          - "{{ k8s_platform_argocd_values }}"
        set_values:
          - value: server.service.type=ClusterIP
            value_type: string
        atomic: true
        wait: true
        timeout: "{{ k8s_platform_helm_timeout }}"

    - name: Wait for the Argo CD server
      kubernetes.core.k8s_info:
        kubeconfig: "{{ k8s_platform_kubeconfig }}"
        host: "{{ k8s_platform_api_server }}"
        kind: Deployment
        namespace: "{{ k8s_platform_argocd_namespace }}"
        name: argocd-server
        wait: true
        wait_condition:
          type: Available
          status: "True"
        wait_timeout: 300
      changed_when: false
