---
- name: Check the Argo CD admin secret
  ansible.builtin.stat:
    path: "{{ k8s_platform_argocd_admin_secret }}"
  register: k8s_platform_argocd_admin_secret_stat

- name: Require the Argo CD admin secret
  ansible.builtin.assert:
    that:
      - k8s_platform_argocd_admin_secret_stat.stat.exists
    fail_msg: "{{ k8s_platform_argocd_admin_secret }} is missing"

- name: Read the Argo CD admin password
  ansible.builtin.command:
    argv:
      - sops
      - -d
      - "{{ k8s_platform_argocd_admin_secret }}"
  register: k8s_platform_argocd_admin_password
  changed_when: false
  no_log: true

- name: Set the Argo CD admin password
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_platform_kubeconfig }}"
    host: "{{ k8s_platform_api_server }}"
    kind: Secret
    namespace: "{{ k8s_platform_argocd_namespace }}"
    name: argocd-secret
    state: patched
    merge_type: merge
    definition:
      stringData:
        admin.password: >-
          {{ k8s_platform_argocd_admin_password.stdout
             | trim
             | ansible.builtin.password_hash(hashtype='bcrypt', rounds=10) }}
        admin.passwordMtime: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"
  no_log: true

- name: Remove the initial Argo CD admin password
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_platform_kubeconfig }}"
    host: "{{ k8s_platform_api_server }}"
    kind: Secret
    namespace: "{{ k8s_platform_argocd_namespace }}"
    name: argocd-initial-admin-secret
    state: absent
  no_log: true
