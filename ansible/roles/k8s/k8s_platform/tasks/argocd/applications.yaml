---
- name: Check for the Argo CD infrastructure kustomization
  ansible.builtin.stat:
    path: "{{ k8s_platform_argocd_infrastructure_dir }}/kustomization.yaml"
  register: k8s_platform_argocd_infrastructure

- name: Require the Argo CD infrastructure kustomization
  ansible.builtin.assert:
    that:
      - k8s_platform_argocd_infrastructure.stat.exists
    fail_msg: the Argo CD infrastructure kustomization is missing

- name: Apply the Argo CD infrastructure
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_platform_kubeconfig }}"
    host: "{{ k8s_platform_api_server }}"
    state: present
    apply: true
    definition: "{{ lookup('kubernetes.core.kustomize', binary_path=k8s_platform_kubectl, dir=k8s_platform_argocd_infrastructure_dir) }}"

- name: Wait for the Argo CD root Application
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k8s_platform_kubeconfig }}"
    host: "{{ k8s_platform_api_server }}"
    api_version: argoproj.io/v1alpha1
    kind: Application
    namespace: "{{ k8s_platform_argocd_namespace }}"
    name: "{{ k8s_platform_argocd_root_application_name }}"
  register: k8s_platform_argocd_root_status
  until: >-
    (k8s_platform_argocd_root_status.resources | default([]) | length > 0)
    and (k8s_platform_argocd_root_status.resources[0].status.sync.status
         | default('')) == 'Synced'
    and (k8s_platform_argocd_root_status.resources[0].status.health.status
         | default('')) == 'Healthy'
  retries: "{{ k8s_platform_argocd_wait_retries }}"
  delay: "{{ k8s_platform_argocd_wait_delay }}"
  changed_when: false
  failed_when: false

- name: Require a healthy Argo CD root Application
  ansible.builtin.assert:
    that:
      - (k8s_platform_argocd_root_status.resources | default([]) | length > 0)
      - (k8s_platform_argocd_root_status.resources[0].status.sync.status
        | default('')) == 'Synced'
      - (k8s_platform_argocd_root_status.resources[0].status.health.status
        | default('')) == 'Healthy'
    fail_msg: >-
      {{ k8s_platform_argocd_root_application_name }} did not become
      Synced and Healthy
    quiet: true
