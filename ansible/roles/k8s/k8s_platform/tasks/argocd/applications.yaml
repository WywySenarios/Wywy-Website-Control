---
- name: Check for the Argo CD infrastructure kustomization
  ansible.builtin.stat:
    path: "{{ k8s_platform_argocd_infrastructure_dir }}/kustomization.yaml"
  register: k8s_platform_argocd_infrastructure

- name: Require the Argo CD infrastructure kustomization
  ansible.builtin.assert:
    that:
      - k8s_platform_argocd_infrastructure.stat.exists
    fail_msg: the Argo CD infrastructure kustomization is missing

- name: Apply the Argo CD infrastructure
  ansible.builtin.command:
    argv:
      - "{{ k8s_platform_kubectl }}"
      - --kubeconfig
      - "{{ k8s_platform_kubeconfig }}"
      - --server
      - "{{ k8s_platform_api_server }}"
      - apply
      - -k
      - "{{ k8s_platform_argocd_infrastructure_dir }}"
  register: k8s_platform_argocd_infrastructure_apply
  changed_when: >-
    'created' in k8s_platform_argocd_infrastructure_apply.stdout
    or 'configured' in k8s_platform_argocd_infrastructure_apply.stdout

- name: Wait for the Argo CD root Application
  ansible.builtin.command:
    argv:
      - "{{ k8s_platform_kubectl }}"
      - --kubeconfig
      - "{{ k8s_platform_kubeconfig }}"
      - --server
      - "{{ k8s_platform_api_server }}"
      - get
      - application
      - "{{ k8s_platform_argocd_root_application_name }}"
      - -n
      - "{{ k8s_platform_argocd_namespace }}"
      - -o
      - "jsonpath={.status.sync.status} {.status.health.status}"
  register: k8s_platform_argocd_root_status
  until: >-
    'Synced' in k8s_platform_argocd_root_status.stdout
    and 'Healthy' in k8s_platform_argocd_root_status.stdout
  retries: "{{ k8s_platform_argocd_wait_retries }}"
  delay: "{{ k8s_platform_argocd_wait_delay }}"
  changed_when: false
