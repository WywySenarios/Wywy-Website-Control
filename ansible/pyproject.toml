[project]
name = "wywy-ansible"
version = "0.0.0"
description = "Pinned Ansible toolchain and the entrypoint for the Wywy playbooks."
requires-python = ">=3.12"
dependencies = [
    "ansible-core==2.18.6",
]

[project.scripts]
wywy-ansible = "wywy_ansible.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ansible-lint==25.1.0",
    "ruff==0.17.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wywy_ansible"]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY001",
    "T201",   # the entrypoint announces the target environment on purpose
]

[tool.ruff.lint.pydocstyle]
convention = "google"
