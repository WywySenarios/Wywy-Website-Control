[project]
name = "wywy-ansible"
version = "0.0.0"
description = "Pinned Ansible toolchain and the entrypoint for the Wywy playbooks."
requires-python = ">=3.12"
dependencies = [
    "ansible-core==2.18.6",
    "bcrypt==4.3.0",
    "passlib==1.7.4",
]

[project.scripts]
wywy-ansible = "wywy_ansible.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ansible-lint==25.1.0",
    "jsonschema==4.26.0",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.1",
    "types-jsonschema==4.26.0.20261006",
    "types-PyYAML==6.0.12.20261103",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wywy_ansible"]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY001",
    "T201",   # the entrypoint announces the target environment on purpose
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D103", # test names are the specification. Docstrings are not needed.
    "S101", # tests need to `assert`
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true

# ansible-core ships no py.typed marker or stubs, so treat it as untyped.
[[tool.mypy.overrides]]
module = ["ansible", "ansible.*"]
follow_imports = "skip"
ignore_missing_imports = true

# The tests monkeypatch wywy_hosts.shutil/subprocess, so those re-exports are
# part of the module's test surface.
[[tool.mypy.overrides]]
module = ["wywy_hosts"]
implicit_reexport = true
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --tb=short"
