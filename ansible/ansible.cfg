[defaults]
roles_path = roles/cloudflare:roles/db:roles/files:roles/k8s:roles/openwrt:roles/pki:roles/proxmox:roles/registry:roles/secrets
collections_path = .collections
lookup_plugins = plugins/lookup
inventory = inventory/shared,inventory/dev
vars_plugins_enabled = host_group_vars,community.sops.sops
stdout_callback = default
callback_result_format = yaml

[community.sops]
# Decrypt on demand so unrelated group_vars files are not loaded during
# inventory parsing.
vars_stage = task

[ssh_connection]
ssh_args = -o StrictHostKeyChecking=accept-new -o BatchMode=yes
