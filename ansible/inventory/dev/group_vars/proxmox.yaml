---
# Shared, non-secret defaults for the physical PVE node pool.
ansible_host: "{{ proxmox_nodes[inventory_hostname].address }}"
proxmox_install_nic: "{{ proxmox_nodes[inventory_hostname].nic }}"
proxmox_install_disk_filter_key: "{{ proxmox_nodes[inventory_hostname].disk_filter.key }}"
proxmox_install_disk_filter_value: "{{ proxmox_nodes[inventory_hostname].disk_filter.value }}"
proxmox_install_fqdn: >-
  {{ proxmox_nodes[inventory_hostname].fqdn | default(inventory_hostname) }}
proxmox_ipv4_prefix: 24
# --- PVE 9 answer-file global section ---
proxmox_install_keyboard: en-us
proxmox_install_country: us
proxmox_install_timezone: UTC

proxmox_cluster_name: "wywy-{{ wywy_env }}"
proxmox_cluster_leader: "{{ groups['proxmox_cluster_leader'] | first }}"
