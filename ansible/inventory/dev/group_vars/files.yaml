---
ansible_host: >-
  {{ (lookup('pipe', "sops -d --output-type binary " ~ control_dir ~
  "/secrets/" ~ wywy_env ~ "/hosts.sops | grep -w files.internal")).split() | first }}
wywy_worker_ips: >-
  {{ (lookup('pipe', "sops -d --output-type binary " ~ control_dir ~
  "/secrets/" ~ wywy_env ~ "/k8s-workers-hosts.sops | grep -oE ^[0-9.]+")).split() }}
wywy_control_plane_ip: >-
  {{ (lookup('pipe', "sops -d --output-type binary " ~ control_dir ~
  "/secrets/" ~ wywy_env ~ "/hosts.sops | grep -w control-plane.internal")).split() | first }}
