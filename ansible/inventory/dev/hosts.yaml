---
all:
  hosts:
    localhost:
      ansible_connection: local
  children:
    # Physical Proxmox node pool.
    proxmox:
      hosts:
        proxmox-1.internal:
          ansible_user: wywy
        proxmox-2.internal:
          ansible_user: wywy
        proxmox-3.internal:
          ansible_user: wywy
    # Role tags. Each tag selects exactly one canonical node; tags may overlap.
    db_pve:
      hosts:
        proxmox-2.internal:
    files_pve:
      hosts:
        proxmox-3.internal:
    registry_pve:
      hosts:
        proxmox-1.internal:
    db:
      hosts:
        db.internal:
          ansible_user: wywy
    files:
      hosts:
        files.internal:
          ansible_user: wywy
    registry:
      hosts:
        registry.internal:
          ansible_user: wywy
    # TEMPORARY: workers are still cloud-init-managed.
    k8s_workers:
      hosts:
        k8s-worker-1.internal:
          ansible_user: wywy
        k8s-worker-2.internal:
          ansible_user: wywy
        k8s-worker-3.internal:
          ansible_user: wywy
