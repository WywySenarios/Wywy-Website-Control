---
all:
  hosts:
    localhost:
      ansible_connection: local
  children:
    proxmox:
      hosts:
        proxmox-1.internal:
          ansible_user: root
        proxmox-2.internal:
          ansible_user: root
        proxmox-3.internal:
          ansible_user: root
    proxmox_cluster_leader:
      hosts:
        proxmox-1.internal:
    proxmox_iso:
      hosts:
        localhost:
    openwrt:
      hosts:
        gateway.internal:
          ansible_user: root
    proxmox_backup: {}
    db_pve:
      hosts:
        proxmox-2.internal:
    files_pve:
      hosts:
        proxmox-3.internal:
    registry_pve:
      hosts:
        proxmox-1.internal:
    db:
      hosts:
        db.internal:
          ansible_user: wywy
    files:
      hosts:
        files.internal:
          ansible_user: wywy
    registry:
      hosts:
        registry.internal:
          ansible_user: wywy
    k8s_vms:
      children:
        k8s:
          children:
            k8s_control_plane:
              hosts:
                k8s-control-plane-1.internal:
                  ansible_user: wywy
                k8s-control-plane-2.internal:
                  ansible_user: wywy
                k8s-control-plane-3.internal:
                  ansible_user: wywy
            k8s_workers:
              hosts:
                k8s-worker-1.internal:
                  ansible_user: wywy
                k8s-worker-2.internal:
                  ansible_user: wywy
                k8s-worker-3.internal:
                  ansible_user: wywy
