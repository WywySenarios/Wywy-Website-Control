---
# Shared, non-secret defaults for the physical PVE node pool.
#
# Every node resolves its address from the encrypted proxmox-hosts file. Role
# tags do not own node addresses.
ansible_host: >-
  {{ lookup('pipe', control_dir ~ '/scripts/lib/hosts-lookup.sh ' ~
  control_dir ~ '/secrets/' ~ wywy_env ~ '/proxmox-hosts.sops ' ~ inventory_hostname) }}
proxmox_ipv4_prefix: 24
