---
ansible_host: >-
  {{ (lookup('pipe', "sops -d --output-type binary " ~ control_dir ~ "/secrets/" ~ wywy_env ~ "/hosts.sops | grep -w db.internal")).split() | first }}
wywy_worker_ips: >-
  {{ (lookup('pipe', "sops -d --output-type binary " ~ control_dir ~ "/secrets/" ~ wywy_env ~ "/k8s-workers-hosts.sops | grep -oE ^[0-9.]+")).split() }}
