---
# --- proxmox_template role ---
proxmox_template_vmid: 2501
proxmox_template_name: "debian-13-db-template-2501"

# --- proxmox_vm role: the DB VM this hypervisor hosts ---
proxmox_vm_vmid: 151
proxmox_vm_name: "database-vm-prod"
proxmox_vm_template_vmid: "{{ proxmox_template_vmid }}"
proxmox_vm_address: "{{ hostvars['db.internal'].ansible_host }}"
proxmox_vm_gateway: "{{ wywy_gateway }}"
proxmox_vm_nameserver: "{{ wywy_nameserver }}"
# The template's 64G plus the 50G create-vm.sh used to add.
proxmox_vm_disk_size: "114G"
