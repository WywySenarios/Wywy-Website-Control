$schema: "https://json-schema.org/draft/2020-12/schema"
title: Environment-wide variables
description: Environment-wide Ansible variables. The proxmox_sdn_* values are rendered from config/base/network.yaml.
type: object
additionalProperties: false
required:
  - wywy_env
  - control_dir
  - wywy_gateway
  - wywy_nameserver
  - k8s_pod_cidr
  - proxmox_sdn_zone
  - proxmox_sdn_vnet
  - proxmox_sdn_vlan_id
  - proxmox_sdn_subnet
  - proxmox_sdn_gateway
  - proxmox_sdn_dns
  - openwrt_operator_source
  - proxmox_template_image
  - cloudflare_public_hosts
properties:
  wywy_env:
    type: string
    enum:
      - dev
      - prod
  control_dir:
    type: string
  wywy_gateway:
    type: string
  wywy_nameserver:
    type: string
  k8s_pod_cidr:
    type: string
    description: Pod CIDR used by Kubernetes and Calico.
  proxmox_sdn_zone:
    type: string
    description: Proxmox SDN zone name for the VM VLAN.
    pattern: "^[a-z][a-z0-9-]*$"
  proxmox_sdn_vnet:
    type: string
    description: Proxmox SDN VNet name for the VM VLAN.
    pattern: "^[a-z][a-z0-9-]*$"
  proxmox_sdn_vlan_id:
    type: string
    description: VLAN ID rendered from config/base/network.yaml; validated as an integer there.
  proxmox_sdn_subnet:
    type: string
    description: VM subnet in CIDR form.
  proxmox_sdn_gateway:
    type: string
    description: OpenWrt VLAN interface address; the VM subnet gateway.
  proxmox_sdn_dns:
    type: string
    description: DNS server address handed to VMs; normally the OpenWrt VLAN interface.
  openwrt_operator_source:
    type: string
    description: Operator IPv4 address rendered from config/base/network.yaml.
    pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}$'
  proxmox_template_image:
    type: object
    additionalProperties: false
    required:
      - url
      - sha512
    properties:
      url:
        type: string
      sha512:
        type: string
  cloudflare_public_hosts:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - name
        - hostname
        - namespace
        - service
      properties:
        name:
          type: string
        hostname:
          type: string
        namespace:
          type: string
        service:
          type: string
