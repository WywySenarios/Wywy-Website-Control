$schema: "https://json-schema.org/draft/2020-12/schema"
title: Encrypted environment-wide variables
description: Sops-encrypted values for the all group.
type: object
additionalProperties: false
required:
  - registry_password
  - sops
properties:
  # Transitional: prod still stores these until secrets/prod/cloudflare.sops.yaml is populated.
  cloudflare_api_token:
    type: string
    pattern: '^ENC\[AES256_GCM,'
  cloudflare_account_id:
    type: string
    pattern: '^ENC\[AES256_GCM,'
  cloudflare_zone_id:
    type: string
    pattern: '^ENC\[AES256_GCM,'
  registry_password:
    type: string
    pattern: '^ENC\[AES256_GCM,'
  # Transitional: prod still stores the retired MetalLB values until that
  # sops file is re-encrypted with the prod age key.
  argocd_load_balancer_ip:
    type: string
    pattern: '^ENC\[AES256_GCM,'
  argocd_load_balancer_source_ranges:
    type: string
    pattern: '^ENC\[AES256_GCM,'
  sops:
    type: object
