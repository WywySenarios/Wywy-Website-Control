$schema: "https://json-schema.org/draft/2020-12/schema"
title: Kubernetes VM definitions
description: Shared variables for the Kubernetes VMs and their Proxmox hosts.
type: object
additionalProperties: false
required:
  - k8s_version
  - containerd_version
  - calico_version
  - k8s_api_hostname
  - k8s_control_plane_hosts
  - k8s_apiserver_extra_sans
properties:
  k8s_version:
    type: string
  containerd_version:
    type: string
  calico_version:
    type: string
  k8s_api_hostname:
    type: string
    description: Stable DNS name for the Kubernetes API. OpenWrt resolves it to the control-plane PVE IPAM allocations.
  k8s_control_plane_hosts:
    type: string
  k8s_apiserver_extra_sans:
    type: string
    description: Comma-separated DNS names for the apiserver certificate. Do not include IPs.
