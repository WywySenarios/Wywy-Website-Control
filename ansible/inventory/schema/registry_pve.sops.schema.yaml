$schema: "https://json-schema.org/draft/2020-12/schema"
title: Encrypted Registry Proxmox VM
description: Sops-encrypted Proxmox template and VM settings for the registry node.
type: object
additionalProperties: false
required:
  - proxmox_template_vmid
  - proxmox_template_name
  - proxmox_vm_vmid
  - proxmox_vm_name
  - proxmox_vm_template_vmid
  - proxmox_vm_address
  - proxmox_vm_gateway
  - proxmox_vm_nameserver
  - proxmox_vm_disk_size
  - proxmox_vm_data_disk_size
  - sops
properties:
  proxmox_template_vmid:
    type: string
    pattern: '^ENC\[AES256_GCM,'
  proxmox_template_name:
    type: string
    pattern: '^ENC\[AES256_GCM,'
  proxmox_vm_vmid:
    type: string
    pattern: '^ENC\[AES256_GCM,'
  proxmox_vm_name:
    type: string
    pattern: '^ENC\[AES256_GCM,'
  proxmox_vm_template_vmid:
    type: string
    pattern: '^ENC\[AES256_GCM,'
  proxmox_vm_address:
    type: string
    pattern: '^ENC\[AES256_GCM,'
  proxmox_vm_gateway:
    type: string
    pattern: '^ENC\[AES256_GCM,'
  proxmox_vm_nameserver:
    type: string
    pattern: '^ENC\[AES256_GCM,'
  proxmox_vm_disk_size:
    type: string
    pattern: '^ENC\[AES256_GCM,'
  proxmox_vm_data_disk_size:
    description: Dedicated ext4 disk for /srv/registry. This disk will contain the payload!
    type: string
    pattern: '^ENC\[AES256_GCM,'
  sops:
    type: object
