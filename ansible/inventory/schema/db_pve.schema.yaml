$schema: "https://json-schema.org/draft/2020-12/schema"
title: Database Proxmox VM
description: Proxmox template and VM settings for the database node.
type: object
additionalProperties: false
required:
  - proxmox_template_vmid
  - proxmox_template_name
  - proxmox_vm_vmid
  - proxmox_vm_name
  - proxmox_vm_template_vmid
  - proxmox_vm_address
  - proxmox_vm_gateway
  - proxmox_vm_nameserver
  - proxmox_vm_disk_size
properties:
  proxmox_template_vmid:
    type: integer
  proxmox_template_name:
    type: string
  proxmox_vm_vmid:
    type: integer
  proxmox_vm_name:
    type: string
  proxmox_vm_template_vmid:
    type: string
  proxmox_vm_address:
    type: string
  proxmox_vm_gateway:
    type: string
  proxmox_vm_nameserver:
    type: string
  proxmox_vm_disk_size:
    type: string
