$schema: "https://json-schema.org/draft/2020-12/schema"
title: Proxmox Backup Server node defaults
description: Non-secret defaults for the physical PBS node pool.
type: object
additionalProperties: false
required:
  - ansible_host
  - proxmox_install_nic
  - proxmox_install_disk_filter_key
  - proxmox_install_disk_filter_value
  - proxmox_install_fqdn
  - proxmox_ipv4_prefix
  - proxmox_install_keyboard
  - proxmox_install_country
  - proxmox_install_timezone
properties:
  ansible_host:
    type: string
  proxmox_install_nic:
    type: string
  proxmox_install_disk_filter_key:
    type: string
  proxmox_install_disk_filter_value:
    type: string
  proxmox_install_fqdn:
    type: string
  proxmox_ipv4_prefix:
    type: integer
  proxmox_install_keyboard:
    type: string
  proxmox_install_country:
    type: string
  proxmox_install_timezone:
    type: string
