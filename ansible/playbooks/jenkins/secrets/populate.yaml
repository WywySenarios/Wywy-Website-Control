---
- name: Populate missing Jenkins secrets
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars_files:
    - ../../../vars/secrets.yaml

  vars:
    sops_secret_verify: false
    populate_secrets:
      - name: jenkins-admin
        namespace: jenkins
        target: "{{ jenkins_secrets_dir }}/jenkins-admin.sops.yaml"
        key: password
        followup: Restart the Jenkins controller to load the new password.
      - name: github-webhook
        namespace: jenkins
        target: "{{ jenkins_secrets_dir }}/github-webhook.sops.yaml"
        key: GITHUB_WEBHOOK_SECRET
        followup: >-
          Restart Jenkins, then re-register hooks: Manage Jenkins -> System ->
          GitHub -> Advanced -> Re-register hooks for all jobs.

  tasks:
    - name: Ensure the Jenkins secret directory exists
      ansible.builtin.file:
        path: "{{ jenkins_secrets_dir }}"
        state: directory
        mode: "0775"

    - name: Check the Jenkins secret targets
      ansible.builtin.stat:
        path: "{{ item.target }}"
      loop: "{{ populate_secrets }}"
      register: populate_stats

    - name: Generate the missing Jenkins secrets
      ansible.builtin.include_role:
        name: sops_secret
        tasks_from: rotate-secret
      vars:
        sops_secret_rotate_target: "{{ item.item.target }}"
        sops_secret_rotate_name: "{{ item.item.name }}"
        sops_secret_rotate_namespace: "{{ item.item.namespace }}"
        sops_secret_rotate_key: "{{ item.item.key }}"
        sops_secret_rotate_followup: "{{ item.item.followup }}"
      loop: "{{ populate_stats.results }}"
      when: not item.stat.exists
      loop_control:
        label: "{{ item.item.name }}"
