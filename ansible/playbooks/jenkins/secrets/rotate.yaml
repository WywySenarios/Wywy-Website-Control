---
# Rotate: jenkins-admin, github-webhook
#
# Additional steps:
#   jenkins-admin: restart Jenkins.
#   github-webhook:
#     1. restart Jenkins
#     2. Manage Jenkins -> System -> GitHub -> Advanced -> Re-register hooks for all jobs.

- name: Rotate one Jenkins secret
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars_files:
    - ../../../vars/secrets.yaml

  vars:
    valid_rotation_tags:
      - jenkins-admin
      - github-webhook

  tasks:
    - name: Validate the rotation tag
      ansible.builtin.include_role:
        name: sops_secret
        tasks_from: validate-rotation-tag
      tags: always

    - name: Rotate the Jenkins admin password
      tags: jenkins-admin
      block:
        - name: Rotate the Jenkins admin password
          ansible.builtin.include_role:
            name: sops_secret
            tasks_from: rotate-secret
          vars:
            sops_secret_rotate_target: >-
              {{ jenkins_secrets_dir }}/jenkins-admin.sops.yaml
            sops_secret_rotate_name: jenkins-admin
            sops_secret_rotate_namespace: jenkins
            sops_secret_rotate_followup: >-
              Restart the Jenkins controller to load the new password.

        - name: Restart the Jenkins controller
          ansible.builtin.command:
            argv:
              - kubectl
              - rollout
              - restart
              - deployment/jenkins
              - -n
              - jenkins
          register: rotate_jenkins_restart
          changed_when: rotate_jenkins_restart.rc == 0
          failed_when: false

        - name: Report the Jenkins admin follow-up
          ansible.builtin.debug:
            msg: >-
              {{ 'Jenkins restarted with the new password.'
                 if rotate_jenkins_restart.rc == 0
                 else 'Store rotated, but the restart failed. Run:
                 kubectl rollout restart deployment/jenkins -n jenkins' }}

    - name: Rotate the GitHub webhook secret
      tags: github-webhook
      block:
        - name: Rotate the GitHub webhook secret
          ansible.builtin.include_role:
            name: sops_secret
            tasks_from: rotate-secret
          vars:
            sops_secret_rotate_target: >-
              {{ jenkins_secrets_dir }}/github-webhook.sops.yaml
            sops_secret_rotate_name: github-webhook
            sops_secret_rotate_namespace: jenkins
            sops_secret_rotate_key: GITHUB_WEBHOOK_SECRET
            sops_secret_rotate_followup: >-
              After Argo CD syncs the secret, restart Jenkins, then re-register
              hooks: Manage Jenkins -> System -> GitHub -> Advanced ->
              Re-register hooks for all jobs.

        - name: Restart the Jenkins controller
          ansible.builtin.command:
            argv:
              - kubectl
              - rollout
              - restart
              - deployment/jenkins
              - -n
              - jenkins
          register: rotate_jenkins_webhook_restart
          changed_when: rotate_jenkins_webhook_restart.rc == 0
          failed_when: false

        - name: Report the GitHub webhook follow-up
          ansible.builtin.debug:
            msg: >-
              {{ 'Jenkins restarted with the new webhook secret.'
                 if rotate_jenkins_webhook_restart.rc == 0
                 else 'Store rotated, but the restart failed. Run:
                 kubectl rollout restart deployment/jenkins -n jenkins' }}
              After Argo CD syncs the secret, restart Jenkins, then re-register
              hooks: Manage Jenkins -> System -> GitHub -> Advanced ->
              Re-register hooks for all jobs.
