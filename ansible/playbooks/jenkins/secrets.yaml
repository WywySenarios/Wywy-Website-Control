---
# Generate the Jenkins KSOPS Secret/ConfigMap inputs from the canonical secrets/ stores.
# The admin password is only generated when the file is missing or when jenkins_admin_force=true.
# Derived files are rewritten only when their canonical source is newer.
- name: Generate Jenkins secret manifests
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    control_dir: "{{ ansible_config_file | dirname | dirname }}"
    wywy_env: dev
    secrets_dir: "{{ control_dir }}/k8s/dev/jenkins/secrets"
    jenkins_admin_force: false

    registry_ip: >-
      {{ lookup('pipe', control_dir ~ '/scripts/lib/hosts-lookup.sh ' ~
      control_dir ~ '/secrets/' ~ wywy_env ~ '/hosts.sops registry.internal') | trim }}

  tasks:
    - name: Create a temporary secrets work directory
      ansible.builtin.command:
        argv:
          - mktemp
          - -d
          - /dev/shm/wywy-jenkins-secrets.XXXXXX
      register: jenkins_secrets_tmp
      changed_when: false

    - name: Set the temporary directory path
      ansible.builtin.set_fact:
        tmp: "{{ jenkins_secrets_tmp.stdout | trim }}"

    - name: Restrict the temporary directory
      ansible.builtin.file:
        path: "{{ tmp }}"
        state: directory
        mode: "0700"

    - name: Generate the Jenkins secret inputs
      block:
        - name: Read the canonical registry password
          ansible.builtin.command:
            argv:
              - sudo
              - -n
              - sops
              - -d
              - --output-type
              - binary
              - "{{ control_dir }}/secrets/{{ wywy_env }}/registry-password.sops"
          register: registry_password_read
          changed_when: false
          check_mode: false
          no_log: true

        - name: Read the internal CA bundle
          ansible.builtin.command:
            argv:
              - sudo
              - -n
              - sops
              - -d
              - --output-type
              - binary
              - "{{ control_dir }}/secrets/{{ wywy_env }}/internal-ca.sops"
          register: internal_ca_read
          changed_when: false
          check_mode: false
          no_log: true

        - name: Derive the registry password and CA certificate
          ansible.builtin.set_fact:
            registry_password: "{{ registry_password_read.stdout | trim }}"
            internal_ca_cert: "{{ (internal_ca_read.stdout | from_yaml).cert }}"
          no_log: true

        - name: Validate the registry password and endpoint
          ansible.builtin.assert:
            that:
              - registry_password | length > 0
              - registry_ip is match('^([0-9]{1,3}\\.){3}[0-9]{1,3}$')
            fail_msg: "registry-password.sops or registry.internal did not resolve to usable values"
            quiet: true

        - name: Build the desired Secret and ConfigMap bodies
          ansible.builtin.set_fact:
            jenkins_registry_creds_content: |
              apiVersion: v1
              kind: Secret
              metadata:
                name: jenkins-registry-creds
                namespace: jenkins
              type: Opaque
              stringData:
                username: admin
                password: {{ registry_password | to_json }}
            jenkins_dockerconfig: >-
              {{ {'auths': {'registry.internal:5000': {
                   'username': 'admin',
                   'password': registry_password,
                   'auth': ('admin:' ~ registry_password) | b64encode
                 }}} | to_json }}
            jenkins_registry_ca_content: |
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: jenkins-registry-ca
                namespace: jenkins
              data:
                ca.crt: |
              {{ internal_ca_cert | indent(4, true) }}
            jenkins_registry_endpoint_content: |
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: registry-endpoint
                namespace: jenkins
              data:
                ip: "{{ registry_ip }}/32"
          no_log: true

        - name: Write the derived plaintext manifests
          ansible.builtin.copy:
            content: "{{ item.content }}"
            dest: "{{ item.plaintext }}"
            mode: "0600"
          loop:
            - name: jenkins-registry-creds
              plaintext: "{{ tmp }}/jenkins-registry-creds.yaml"
              content: "{{ jenkins_registry_creds_content }}"
            - name: regcred
              plaintext: "{{ tmp }}/regcred.yaml"
              content: |
                apiVersion: v1
                kind: Secret
                metadata:
                  name: regcred
                  namespace: jenkins
                type: kubernetes.io/dockerconfigjson
                stringData:
                  ".dockerconfigjson": {{ jenkins_dockerconfig | to_json }}
            - name: jenkins-registry-ca
              plaintext: "{{ tmp }}/jenkins-registry-ca.yaml"
              content: "{{ jenkins_registry_ca_content }}"
            - name: registry-endpoint
              plaintext: "{{ tmp }}/registry-endpoint.yaml"
              content: "{{ jenkins_registry_endpoint_content }}"
          no_log: true

        - name: Check the canonical source timestamps
          ansible.builtin.stat:
            path: "{{ item }}"
          loop:
            - "{{ control_dir }}/secrets/{{ wywy_env }}/registry-password.sops"
            - "{{ control_dir }}/secrets/{{ wywy_env }}/internal-ca.sops"
            - "{{ control_dir }}/secrets/{{ wywy_env }}/hosts.sops"
          register: jenkins_secret_sources

        - name: Check the derived target timestamps
          ansible.builtin.stat:
            path: "{{ item }}"
          loop:
            - "{{ secrets_dir }}/jenkins-registry-creds.sops.yaml"
            - "{{ secrets_dir }}/regcred.sops.yaml"
            - "{{ secrets_dir }}/jenkins-registry-ca.sops.yaml"
            - "{{ secrets_dir }}/registry-endpoint.sops.yaml"
          register: jenkins_secret_targets

        - name: Map derived targets to sources
          ansible.builtin.set_fact:
            jenkins_derived_secrets:
              - name: jenkins-registry-creds
                plaintext: "{{ tmp }}/jenkins-registry-creds.yaml"
                encrypted: "{{ tmp }}/jenkins-registry-creds.enc.yaml"
                target: "{{ secrets_dir }}/jenkins-registry-creds.sops.yaml"
                source: "{{ jenkins_secret_sources.results[0] }}"
                target_stat: "{{ jenkins_secret_targets.results[0] }}"
              - name: regcred
                plaintext: "{{ tmp }}/regcred.yaml"
                encrypted: "{{ tmp }}/regcred.enc.yaml"
                target: "{{ secrets_dir }}/regcred.sops.yaml"
                source: "{{ jenkins_secret_sources.results[0] }}"
                target_stat: "{{ jenkins_secret_targets.results[1] }}"
              - name: jenkins-registry-ca
                plaintext: "{{ tmp }}/jenkins-registry-ca.yaml"
                encrypted: "{{ tmp }}/jenkins-registry-ca.enc.yaml"
                target: "{{ secrets_dir }}/jenkins-registry-ca.sops.yaml"
                source: "{{ jenkins_secret_sources.results[1] }}"
                target_stat: "{{ jenkins_secret_targets.results[2] }}"
              - name: registry-endpoint
                plaintext: "{{ tmp }}/registry-endpoint.yaml"
                encrypted: "{{ tmp }}/registry-endpoint.enc.yaml"
                target: "{{ secrets_dir }}/registry-endpoint.sops.yaml"
                source: "{{ jenkins_secret_sources.results[2] }}"
                target_stat: "{{ jenkins_secret_targets.results[3] }}"
          no_log: true

        - name: Encrypt changed derived manifests
          ansible.builtin.shell:
            cmd: |
              set -euo pipefail
              sudo -n sops -e --filename-override "{{ item.target }}" \
                "{{ item.plaintext }}" > "{{ item.encrypted }}"
              mv "{{ item.encrypted }}" "{{ item.target }}"
            executable: /bin/bash
          loop: "{{ jenkins_derived_secrets }}"
          when: >-
            not item.target_stat.stat.exists
            or (item.target_stat.stat.mtime | default(0)) < item.source.stat.mtime
          changed_when: true
          no_log: true

        - name: Check for the Jenkins admin secret
          ansible.builtin.stat:
            path: "{{ secrets_dir }}/jenkins-admin.sops.yaml"
          register: jenkins_admin_stat

        - name: Generate the Jenkins admin password
          ansible.builtin.command:
            argv:
              - openssl
              - rand
              - -base64
              - "32"
          register: jenkins_admin_password
          when: not jenkins_admin_stat.stat.exists or jenkins_admin_force | bool
          changed_when: false
          no_log: true

        - name: Write the Jenkins admin plaintext manifest
          ansible.builtin.copy:
            content: |
              apiVersion: v1
              kind: Secret
              metadata:
                name: jenkins-admin
                namespace: jenkins
              type: Opaque
              stringData:
                password: {{ jenkins_admin_password.stdout | trim | to_json }}
            dest: "{{ tmp }}/jenkins-admin.yaml"
            mode: "0600"
          when: not jenkins_admin_stat.stat.exists or jenkins_admin_force | bool
          no_log: true

        - name: Encrypt the Jenkins admin secret
          ansible.builtin.shell:
            cmd: |
              set -euo pipefail
              sudo -n sops -e --filename-override "{{ secrets_dir }}/jenkins-admin.sops.yaml" \
                "{{ tmp }}/jenkins-admin.yaml" > "{{ tmp }}/jenkins-admin.enc.yaml"
              mv "{{ tmp }}/jenkins-admin.enc.yaml" "{{ secrets_dir }}/jenkins-admin.sops.yaml"
            executable: /bin/bash
          when: not jenkins_admin_stat.stat.exists or jenkins_admin_force | bool
          changed_when: true
          no_log: true

        - name: Check for the GitHub webhook secret
          ansible.builtin.stat:
            path: "{{ secrets_dir }}/github-webhook.sops.yaml"
          register: github_webhook_stat

        - name: Generate the GitHub webhook secret
          ansible.builtin.command:
            argv:
              - openssl
              - rand
              - -base64
              - "32"
          register: github_webhook_secret
          when: not github_webhook_stat.stat.exists
          changed_when: false
          no_log: true

        - name: Write the GitHub webhook plaintext manifest
          ansible.builtin.copy:
            content: |
              apiVersion: v1
              kind: Secret
              metadata:
                name: github-webhook
                namespace: jenkins
              type: Opaque
              stringData:
                GITHUB_WEBHOOK_SECRET: {{ github_webhook_secret.stdout | trim | to_json }}
            dest: "{{ tmp }}/github-webhook.yaml"
            mode: "0600"
          when: not github_webhook_stat.stat.exists
          no_log: true

        - name: Encrypt the GitHub webhook secret
          ansible.builtin.shell:
            cmd: |
              set -euo pipefail
              sudo -n sops -e --filename-override "{{ secrets_dir }}/github-webhook.sops.yaml" \
                "{{ tmp }}/github-webhook.yaml" > "{{ tmp }}/github-webhook.enc.yaml"
              mv "{{ tmp }}/github-webhook.enc.yaml" "{{ secrets_dir }}/github-webhook.sops.yaml"
            executable: /bin/bash
          when: not github_webhook_stat.stat.exists
          changed_when: true
          no_log: true

      always:
        - name: Remove the temporary secrets work directory
          ansible.builtin.file:
            path: "{{ tmp }}"
            state: absent
          when: tmp is defined
