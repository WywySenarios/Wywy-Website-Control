---
- name: Manage the Cloudflare tunnel, DNS, and Access
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    control_dir: "{{ ansible_config_file | dirname | dirname }}"
    wywy_env: dev
    cloudflare_api_base: https://api.cloudflare.com/client/v4
    cloudflare_tunnel_name: jenkins
    cloudflare_public_url_file: "{{ control_dir }}/k8s/{{ wywy_env }}/jenkins/public-url.yaml"
    cloudflare_ingress_file: "{{ control_dir }}/ansible/playbooks/jenkins/files/cloudflared-ingress.json.j2"
    cloudflare_tunnel_token_file: "{{ control_dir }}/k8s/dev/jenkins/secrets/cloudflared-tunnel-token.sops.yaml"
    cloudflare_tunnel_rotate: false
    cloudflare_access_allowed_emails: []
    cloudflare_ui_app_name: Jenkins UI
    cloudflare_webhook_app_name: Jenkins GitHub Webhook

  tasks:
    - name: Create a temporary work directory
      ansible.builtin.command:
        argv:
          - mktemp
          - -d
          - /dev/shm/wywy-cloudflare.XXXXXX
      register: cloudflare_tmp
      changed_when: false

    - name: Set the temporary directory path
      ansible.builtin.set_fact:
        tmp: "{{ cloudflare_tmp.stdout | trim }}"

    - name: Restrict the temporary directory
      ansible.builtin.file:
        path: "{{ tmp }}"
        state: directory
        mode: "0700"

    - name: Manage the Cloudflare tunnel
      block:
        - name: Validate the Cloudflare inputs
          ansible.builtin.assert:
            that:
              - cloudflare_api_token is defined
              - cloudflare_api_token | length > 0
              - cloudflare_account_id is defined
              - cloudflare_account_id | length > 0
              - cloudflare_zone_id is defined
              - cloudflare_zone_id | length > 0
              - cloudflare_access_allowed_emails | length > 0
            fail_msg: >-
              Cloudflare secrets must be defined in inventory/<env>/group_vars/all.sops.yaml
            quiet: true
          no_log: true

        - name: Build the Cloudflare API headers
          ansible.builtin.set_fact:
            cloudflare_headers:
              Authorization: "Bearer {{ cloudflare_api_token }}"
              Content-Type: application/json
          no_log: true

        - name: Read the Jenkins public URL
          ansible.builtin.set_fact:
            cloudflare_public_url_config: "{{ lookup('file', cloudflare_public_url_file) | from_yaml }}"

        - name: Set the Jenkins public hostname
          ansible.builtin.set_fact:
            cloudflare_hostname: "{{ cloudflare_public_url_config.data.public_url | urlsplit('hostname') }}"

        - name: Look up the tunnel
          ansible.builtin.uri:
            url: "{{ cloudflare_api_base }}/accounts/{{ cloudflare_account_id }}/cfd_tunnel?name={{ cloudflare_tunnel_name }}&is_deleted=false"
            method: GET
            headers: "{{ cloudflare_headers }}"
            status_code: 200
          register: cloudflare_tunnel_list
          changed_when: false
          no_log: true

        - name: Select the existing tunnel
          ansible.builtin.set_fact:
            cloudflare_tunnel_id: >-
              {{ ((cloudflare_tunnel_list.json.result | default([]))
              | selectattr('name', 'equalto', cloudflare_tunnel_name)
              | list | first | default({})).id | default('') }}
          no_log: true

        - name: Create the tunnel
          ansible.builtin.uri:
            url: "{{ cloudflare_api_base }}/accounts/{{ cloudflare_account_id }}/cfd_tunnel"
            method: POST
            headers: "{{ cloudflare_headers }}"
            body_format: json
            body:
              name: "{{ cloudflare_tunnel_name }}"
              config_src: cloudflare
            status_code:
              - 200
              - 201
          register: cloudflare_tunnel_create
          when: cloudflare_tunnel_id | length == 0
          no_log: true

        - name: Record the created tunnel
          ansible.builtin.set_fact:
            cloudflare_tunnel_id: "{{ cloudflare_tunnel_create.json.result.id }}"
          when: cloudflare_tunnel_id | length == 0
          no_log: true

        - name: Read the tunnel ingress
          ansible.builtin.set_fact:
            cloudflare_ingress: "{{ lookup('template', cloudflare_ingress_file) }}"
          changed_when: false

        - name: Apply the tunnel ingress
          ansible.builtin.uri:
            url: "{{ cloudflare_api_base }}/accounts/{{ cloudflare_account_id }}/cfd_tunnel/{{ cloudflare_tunnel_id }}/configurations"
            method: PUT
            headers: "{{ cloudflare_headers }}"
            body_format: json
            body:
              config: "{{ cloudflare_ingress }}"
            status_code: 200
          no_log: true

        - name: Check the tunnel token secret
          ansible.builtin.stat:
            path: "{{ cloudflare_tunnel_token_file }}"
          register: cloudflare_tunnel_token_stat
          changed_when: false

        - name: Retrieve the tunnel token
          ansible.builtin.uri:
            url: "{{ cloudflare_api_base }}/accounts/{{ cloudflare_account_id }}/cfd_tunnel/{{ cloudflare_tunnel_id }}/token"
            method: GET
            headers: "{{ cloudflare_headers }}"
            status_code: 200
          register: cloudflare_tunnel_token_current
          when: not cloudflare_tunnel_token_stat.stat.exists or cloudflare_tunnel_rotate | bool
          no_log: true

        - name: Generate a new tunnel secret
          ansible.builtin.command:
            argv:
              - openssl
              - rand
              - -base64
              - "32"
          register: cloudflare_tunnel_secret
          when: cloudflare_tunnel_rotate | bool
          changed_when: false
          no_log: true

        - name: Rotate the tunnel token
          ansible.builtin.uri:
            url: "{{ cloudflare_api_base }}/accounts/{{ cloudflare_account_id }}/cfd_tunnel/{{ cloudflare_tunnel_id }}"
            method: PATCH
            headers: "{{ cloudflare_headers }}"
            body_format: json
            body:
              name: "{{ cloudflare_tunnel_name }}"
              tunnel_secret: "{{ cloudflare_tunnel_secret.stdout | trim }}"
            status_code: 200
          register: cloudflare_tunnel_rotate_result
          when: cloudflare_tunnel_rotate | bool
          no_log: true

        - name: Capture the current tunnel token
          ansible.builtin.set_fact:
            cloudflare_tunnel_token: "{{ cloudflare_tunnel_token_current.json.result }}"
          when: not cloudflare_tunnel_rotate | bool and not cloudflare_tunnel_token_stat.stat.exists
          no_log: true

        - name: Capture the rotated tunnel token
          ansible.builtin.set_fact:
            cloudflare_tunnel_token: "{{ cloudflare_tunnel_rotate_result.json.result.token }}"
          when: cloudflare_tunnel_rotate | bool
          no_log: true

        - name: Write the tunnel token manifest
          ansible.builtin.copy:
            content: |
              apiVersion: v1
              kind: Secret
              metadata:
                name: cloudflared-tunnel-token
                namespace: jenkins
              type: Opaque
              stringData:
                TUNNEL_TOKEN: {{ cloudflare_tunnel_token | to_json }}
            dest: "{{ tmp }}/cloudflared-tunnel-token.yaml"
            mode: "0600"
          when: not cloudflare_tunnel_token_stat.stat.exists or cloudflare_tunnel_rotate | bool
          no_log: true

        - name: Encrypt the tunnel token secret
          ansible.builtin.shell:
            cmd: |
              set -euo pipefail
              sops -e --filename-override "{{ cloudflare_tunnel_token_file }}" \
                "{{ tmp }}/cloudflared-tunnel-token.yaml" > "{{ tmp }}/cloudflared-tunnel-token.enc.yaml"
              mv "{{ tmp }}/cloudflared-tunnel-token.enc.yaml" "{{ cloudflare_tunnel_token_file }}"
            executable: /bin/bash
          when: not cloudflare_tunnel_token_stat.stat.exists or cloudflare_tunnel_rotate | bool
          changed_when: true
          no_log: true

        - name: Bump the cloudflared token rotation annotation
          ansible.builtin.replace:
            path: "{{ control_dir }}/k8s/base/jenkins/cloudflared-deployment.yaml"
            regexp: 'jenkins\.wywy/token-rotation: .*'
            replace: 'jenkins.wywy/token-rotation: "{{ now(utc=true).strftime("%Y-%m-%dT%H:%M:%SZ") }}"'
          when: cloudflare_tunnel_rotate | bool

        - name: Look up the DNS record
          ansible.builtin.uri:
            url: "{{ cloudflare_api_base }}/zones/{{ cloudflare_zone_id }}/dns_records?type=CNAME&name={{ cloudflare_hostname }}"
            method: GET
            headers: "{{ cloudflare_headers }}"
            status_code: 200
          register: cloudflare_dns
          changed_when: false
          no_log: true

        - name: Create the DNS record
          ansible.builtin.uri:
            url: "{{ cloudflare_api_base }}/zones/{{ cloudflare_zone_id }}/dns_records"
            method: POST
            headers: "{{ cloudflare_headers }}"
            body_format: json
            body:
              type: CNAME
              name: "{{ cloudflare_hostname }}"
              content: "{{ cloudflare_tunnel_id }}.cfargotunnel.com"
              proxied: true
            status_code:
              - 200
              - 201
          when: (cloudflare_dns.json.result | default([])) | length == 0
          no_log: true

        - name: Update the DNS record
          ansible.builtin.uri:
            url: "{{ cloudflare_api_base }}/zones/{{ cloudflare_zone_id }}/dns_records/{{ item.id }}"
            method: PATCH
            headers: "{{ cloudflare_headers }}"
            body_format: json
            body:
              content: "{{ cloudflare_tunnel_id }}.cfargotunnel.com"
              proxied: true
            status_code: 200
          loop: "{{ cloudflare_dns.json.result | default([]) }}"
          when: >-
            item.content != cloudflare_tunnel_id ~ '.cfargotunnel.com'
            or not item.proxied
          no_log: true

        - name: Look up the Access applications
          ansible.builtin.uri:
            url: "{{ cloudflare_api_base }}/accounts/{{ cloudflare_account_id }}/access/apps"
            method: GET
            headers: "{{ cloudflare_headers }}"
            status_code: 200
          register: cloudflare_access_apps
          changed_when: false
          no_log: true

        - name: Find the UI application
          ansible.builtin.set_fact:
            cloudflare_ui_app: >-
              {{ (cloudflare_access_apps.json.result | default([]))
              | selectattr('name', 'equalto', cloudflare_ui_app_name)
              | list | first | default({}) }}
          no_log: true

        - name: Create the UI application
          ansible.builtin.uri:
            url: "{{ cloudflare_api_base }}/accounts/{{ cloudflare_account_id }}/access/apps"
            method: POST
            headers: "{{ cloudflare_headers }}"
            body_format: json
            body:
              name: "{{ cloudflare_ui_app_name }}"
              domain: "{{ cloudflare_hostname }}"
              type: self_hosted
              session_duration: 24h
            status_code:
              - 200
              - 201
          register: cloudflare_ui_app_create
          when: cloudflare_ui_app.id is not defined
          no_log: true

        - name: Record the existing UI application ID
          ansible.builtin.set_fact:
            cloudflare_ui_app_id: "{{ cloudflare_ui_app.id }}"
          when: cloudflare_ui_app.id is defined
          no_log: true

        - name: Record the created UI application ID
          ansible.builtin.set_fact:
            cloudflare_ui_app_id: "{{ cloudflare_ui_app_create.json.result.id }}"
          when: cloudflare_ui_app.id is not defined
          no_log: true

        - name: Look up the UI policies
          ansible.builtin.uri:
            url: "{{ cloudflare_api_base }}/accounts/{{ cloudflare_account_id }}/access/apps/{{ cloudflare_ui_app_id }}/policies"
            method: GET
            headers: "{{ cloudflare_headers }}"
            status_code: 200
          register: cloudflare_ui_policies
          changed_when: false
          no_log: true

        - name: Create the UI allow policies
          ansible.builtin.uri:
            url: "{{ cloudflare_api_base }}/accounts/{{ cloudflare_account_id }}/access/apps/{{ cloudflare_ui_app_id }}/policies"
            method: POST
            headers: "{{ cloudflare_headers }}"
            body_format: json
            body:
              name: "Allow {{ item }}"
              decision: allow
              include:
                - email:
                    email: "{{ item }}"
            status_code:
              - 200
              - 201
          loop: "{{ cloudflare_access_allowed_emails }}"
          when: ("Allow " ~ item) not in ((cloudflare_ui_policies.json.result | default([])) | map(attribute='name') | list)
          no_log: true

        - name: Find the webhook application
          ansible.builtin.set_fact:
            cloudflare_webhook_app: >-
              {{ (cloudflare_access_apps.json.result | default([]))
              | selectattr('name', 'equalto', cloudflare_webhook_app_name)
              | list | first | default({}) }}
          no_log: true

        - name: Create the webhook application
          ansible.builtin.uri:
            url: "{{ cloudflare_api_base }}/accounts/{{ cloudflare_account_id }}/access/apps"
            method: POST
            headers: "{{ cloudflare_headers }}"
            body_format: json
            body:
              name: "{{ cloudflare_webhook_app_name }}"
              domain: "{{ cloudflare_hostname }}/github-webhook"
              type: self_hosted
              session_duration: 24h
            status_code:
              - 200
              - 201
          register: cloudflare_webhook_app_create
          when: cloudflare_webhook_app.id is not defined
          no_log: true

        - name: Record the existing webhook application ID
          ansible.builtin.set_fact:
            cloudflare_webhook_app_id: "{{ cloudflare_webhook_app.id }}"
          when: cloudflare_webhook_app.id is defined
          no_log: true

        - name: Record the created webhook application ID
          ansible.builtin.set_fact:
            cloudflare_webhook_app_id: "{{ cloudflare_webhook_app_create.json.result.id }}"
          when: cloudflare_webhook_app.id is not defined
          no_log: true

        - name: Look up the webhook policies
          ansible.builtin.uri:
            url: "{{ cloudflare_api_base }}/accounts/{{ cloudflare_account_id }}/access/apps/{{ cloudflare_webhook_app_id }}/policies"
            method: GET
            headers: "{{ cloudflare_headers }}"
            status_code: 200
          register: cloudflare_webhook_policies
          changed_when: false
          no_log: true

        - name: Create the webhook bypass policy
          ansible.builtin.uri:
            url: "{{ cloudflare_api_base }}/accounts/{{ cloudflare_account_id }}/access/apps/{{ cloudflare_webhook_app_id }}/policies"
            method: POST
            headers: "{{ cloudflare_headers }}"
            body_format: json
            body:
              name: Bypass GitHub webhook
              decision: bypass
              include:
                - everyone: {}
            status_code:
              - 200
              - 201
          when: '"Bypass GitHub webhook" not in ((cloudflare_webhook_policies.json.result | default([])) | map(attribute=''name'') | list)'
          no_log: true

      always:
        - name: Remove the temporary work directory
          ansible.builtin.file:
            path: "{{ tmp }}"
            state: absent
          when: tmp is defined
