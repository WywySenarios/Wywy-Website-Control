---
- name: Build and push Jenkins images
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    control_dir: "{{ ansible_config_file | dirname | dirname }}"
    wywy_env: dev

    jenkins_version: "2.580.1"
    agent_version: "3391.va_37fa_a_305d6d-5"
    docker_version: "29.6.2"
    compose_version: "5.4.0"
    gitleaks_version: "8.30.1"
    kind_version: "v0.33.0"
    kubectl_version: "v1.37.1"

    registry: "registry.internal:5000"
    registry_user: admin

    jenkins_image: "{{ registry }}/jenkins:{{ jenkins_version }}"
    agent_image: "{{ registry }}/jenkins-agent:{{ agent_version }}"
    kind_image: "{{ registry }}/jenkins-agent-kind:{{ agent_version }}"

  tasks:
    - name: Build the Jenkins controller image
      ansible.builtin.command:
        argv:
          - docker
          - build
          - --build-arg
          - "JENKINS_VERSION={{ jenkins_version }}"
          - -t
          - "{{ jenkins_image }}"
          - "{{ control_dir }}/docker/jenkins"
      changed_when: true

    - name: Build the Jenkins agent image
      ansible.builtin.command:
        argv:
          - docker
          - build
          - --build-arg
          - "AGENT_VERSION={{ agent_version }}"
          - --build-arg
          - "DOCKER_VERSION={{ docker_version }}"
          - --build-arg
          - "COMPOSE_VERSION={{ compose_version }}"
          - --build-arg
          - "GITLEAKS_VERSION={{ gitleaks_version }}"
          - -t
          - "{{ agent_image }}"
          - "{{ control_dir }}/docker/jenkins-agent"
      changed_when: true

    - name: Build the Jenkins kind agent image
      ansible.builtin.command:
        argv:
          - docker
          - build
          - --build-arg
          - "AGENT_VERSION={{ agent_version }}"
          - --build-arg
          - "KIND_VERSION={{ kind_version }}"
          - --build-arg
          - "KUBECTL_VERSION={{ kubectl_version }}"
          - -t
          - "{{ kind_image }}"
          - "{{ control_dir }}/docker/jenkins-agent-kind"
      changed_when: true

    - name: Push the Jenkins images
      block:
        - name: Create a temporary Docker config on tmpfs
          ansible.builtin.command:
            argv:
              - mktemp
              - -d
              - /dev/shm/wywy-docker-config.XXXXXX
          register: docker_config_dir
          changed_when: false

        - name: Restrict the temporary Docker config
          ansible.builtin.file:
            path: "{{ docker_config_dir.stdout | trim }}"
            state: directory
            mode: "0700"

        - name: Authenticate to the internal registry
          ansible.builtin.shell:
            cmd: |
              set -euo pipefail
              if [ "$(id -u)" -eq 0 ]; then
                sops -d --output-type binary "{{ control_dir }}/secrets/{{ wywy_env }}/registry-password.sops"
              else
                sudo -n sops -d --output-type binary "{{ control_dir }}/secrets/{{ wywy_env }}/registry-password.sops"
              fi | docker login --password-stdin -u "{{ registry_user }}" "{{ registry }}"
            executable: /bin/bash
          environment:
            DOCKER_CONFIG: "{{ docker_config_dir.stdout | trim }}"
          changed_when: true
          no_log: true

        - name: Push the Jenkins images
          ansible.builtin.command:
            argv:
              - docker
              - push
              - "{{ item }}"
          loop:
            - "{{ jenkins_image }}"
            - "{{ agent_image }}"
            - "{{ kind_image }}"
          environment:
            DOCKER_CONFIG: "{{ docker_config_dir.stdout | trim }}"
          changed_when: true

      always:
        - name: Remove the temporary Docker config
          ansible.builtin.file:
            path: "{{ docker_config_dir.stdout | trim }}"
            state: absent
          when:
            - docker_config_dir is defined
            - docker_config_dir.stdout | default('') | trim | length > 0
