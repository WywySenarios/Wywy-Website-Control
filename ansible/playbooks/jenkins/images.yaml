---
- name: Build and push Jenkins images
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    control_dir: "{{ ansible_config_file | dirname | dirname }}"
    wywy_env: dev

    jenkins_version: "2.580.1"
    jenkins_image_tag: "2.580.1-3"
    agent_version: "3391.va_37fa_a_305d6d-5"
    docker_version: "29.6.2"
    compose_version: "5.4.0"
    betterleaks_version: "1.9.0"
    betterleaks_sha256: "f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7"
    kind_version: "v0.33.0"
    kubectl_version: "v1.37.1"
    kustomize_version: "5.8.3"
    kustomize_sha256: "cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61"
    kubeconform_version: "0.8.0"
    kubeconform_sha256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
    kube_linter_version: "0.8.3"
    kube_linter_sha256: "1a6d8419b11971372971fdbc22682b684ebfb7cf1c39591662d1b6ca736c41df"
    yamllint_version: "1.38.0"

    registry: "registry.internal:5000"
    registry_user: admin

    jenkins_image: "{{ registry }}/jenkins:{{ jenkins_image_tag }}"
    agent_image: "{{ registry }}/jenkins-agent:{{ agent_version }}"
    betterleaks_image: "{{ registry }}/jenkins-agent-betterleaks:{{ agent_version }}"
    kind_image: "{{ registry }}/jenkins-agent-kind:{{ agent_version }}"
    manifests_image: "{{ registry }}/jenkins-agent-manifests:{{ agent_version }}"

  tasks:
    - name: Build the Jenkins controller image
      ansible.builtin.command:
        argv:
          - docker
          - build
          - --build-arg
          - "JENKINS_VERSION={{ jenkins_version }}"
          - -t
          - "{{ jenkins_image }}"
          - "{{ control_dir }}/docker/jenkins"
      changed_when: true

    - name: Build the Jenkins agent image
      ansible.builtin.command:
        argv:
          - docker
          - build
          - --build-arg
          - "AGENT_VERSION={{ agent_version }}"
          - --build-arg
          - "DOCKER_VERSION={{ docker_version }}"
          - --build-arg
          - "COMPOSE_VERSION={{ compose_version }}"
          - --build-arg
          - "BETTERLEAKS_VERSION={{ betterleaks_version }}"
          - -t
          - "{{ agent_image }}"
          - "{{ control_dir }}/docker/jenkins-agent"
      changed_when: true

    - name: Build the Jenkins betterleaks agent image
      ansible.builtin.command:
        argv:
          - docker
          - build
          - --build-arg
          - "AGENT_VERSION={{ agent_version }}"
          - --build-arg
          - "BETTERLEAKS_VERSION={{ betterleaks_version }}"
          - --build-arg
          - "BETTERLEAKS_SHA256={{ betterleaks_sha256 }}"
          - -t
          - "{{ betterleaks_image }}"
          - "{{ control_dir }}/docker/jenkins-agent-betterleaks"
      changed_when: true

    - name: Build the Jenkins kind agent image
      ansible.builtin.command:
        argv:
          - docker
          - build
          - --build-arg
          - "AGENT_VERSION={{ agent_version }}"
          - --build-arg
          - "KIND_VERSION={{ kind_version }}"
          - --build-arg
          - "KUBECTL_VERSION={{ kubectl_version }}"
          - -t
          - "{{ kind_image }}"
          - "{{ control_dir }}/docker/jenkins-agent-kind"
      changed_when: true

    - name: Build the Jenkins manifests agent image
      ansible.builtin.command:
        argv:
          - docker
          - build
          - --build-arg
          - "AGENT_VERSION={{ agent_version }}"
          - --build-arg
          - "KUSTOMIZE_VERSION={{ kustomize_version }}"
          - --build-arg
          - "KUSTOMIZE_SHA256={{ kustomize_sha256 }}"
          - --build-arg
          - "KUBECONFORM_VERSION={{ kubeconform_version }}"
          - --build-arg
          - "KUBECONFORM_SHA256={{ kubeconform_sha256 }}"
          - --build-arg
          - "KUBE_LINTER_VERSION={{ kube_linter_version }}"
          - --build-arg
          - "KUBE_LINTER_SHA256={{ kube_linter_sha256 }}"
          - --build-arg
          - "YAMLLINT_VERSION={{ yamllint_version }}"
          - -t
          - "{{ manifests_image }}"
          - "{{ control_dir }}/docker/jenkins-agent-manifests"
      changed_when: true

    - name: Push the Jenkins images
      block:
        - name: Create a temporary Docker config on tmpfs
          ansible.builtin.command:
            argv:
              - mktemp
              - -d
              - /dev/shm/wywy-docker-config.XXXXXX
          register: docker_config_dir
          changed_when: false

        - name: Restrict the temporary Docker config
          ansible.builtin.file:
            path: "{{ docker_config_dir.stdout | trim }}"
            state: directory
            mode: "0700"

        - name: Authenticate to the internal registry
          ansible.builtin.command:
            argv:
              - docker
              - login
              - --password-stdin
              - -u
              - "{{ registry_user }}"
              - "{{ registry }}"
            stdin: "{{ registry_password }}"
          environment:
            DOCKER_CONFIG: "{{ docker_config_dir.stdout | trim }}"
          changed_when: true
          no_log: true

        - name: Push the Jenkins images
          ansible.builtin.command:
            argv:
              - docker
              - push
              - "{{ item }}"
          loop:
            - "{{ jenkins_image }}"
            - "{{ agent_image }}"
            - "{{ betterleaks_image }}"
            - "{{ kind_image }}"
            - "{{ manifests_image }}"
          environment:
            DOCKER_CONFIG: "{{ docker_config_dir.stdout | trim }}"
          changed_when: true

      always:
        - name: Remove the temporary Docker config
          ansible.builtin.file:
            path: "{{ docker_config_dir.stdout | trim }}"
            state: absent
          when:
            - docker_config_dir is defined
            - docker_config_dir.stdout | default('') | trim | length > 0
