---
- name: Populate the missing Grafana admin secret
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars_files:
    - ../../../../vars/secrets.yaml

  vars:
    sops_secret_verify: false

  tasks:
    - name: Ensure the observability secret directory exists
      ansible.builtin.file:
        path: "{{ observability_secrets_dir }}"
        state: directory
        mode: "0775"

    - name: Check the Grafana admin secret
      ansible.builtin.stat:
        path: "{{ observability_secrets_dir }}/grafana-admin.sops.yaml"
      register: populate_grafana_admin

    - name: Generate the Grafana admin password
      ansible.builtin.set_fact:
        populate_grafana_password: >-
          {{ lookup('pipe', 'openssl rand -base64 32') | trim }}
      when: not populate_grafana_admin.stat.exists
      no_log: true

    - name: Store the Grafana admin secret
      ansible.builtin.include_role:
        name: sops_secret
      vars:
        sops_secret_target: >-
          {{ observability_secrets_dir }}/grafana-admin.sops.yaml
        sops_secret_format: yaml
        sops_secret_plaintext: >-
          {{ {'apiVersion': 'v1',
              'kind': 'Secret',
              'metadata': {'name': 'grafana-admin',
                           'namespace': 'observability'},
              'type': 'Opaque',
              'stringData': {'admin-user': 'admin',
                             'admin-password': populate_grafana_password}}
             | to_nice_yaml }}
        sops_secret_expected: >-
          {{ {'apiVersion': 'v1',
              'kind': 'Secret',
              'metadata': {'name': 'grafana-admin',
                           'namespace': 'observability'},
              'type': 'Opaque',
              'stringData': {'admin-user': 'admin',
                             'admin-password': populate_grafana_password}}
             | to_json }}
      when: not populate_grafana_admin.stat.exists
      no_log: true
