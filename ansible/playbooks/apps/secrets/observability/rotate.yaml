---
# Rotate: grafana-admin
#
# Additional steps: restart the Grafana container.

- name: Rotate the Grafana admin password
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars_files:
    - ../../../../vars/secrets.yaml

  vars:
    valid_rotation_tags:
      - grafana-admin

  tasks:
    - name: Validate the rotation tag
      ansible.builtin.include_role:
        name: sops_secret
        tasks_from: validate-rotation-tag
      tags: always

    - name: Rotate the Grafana admin password
      tags: grafana-admin
      block:
        - name: Generate the Grafana admin password
          ansible.builtin.set_fact:
            rotate_password: >-
              {{ lookup('pipe', 'openssl rand -base64 32') | trim }}
          no_log: true

        - name: Store the Grafana admin secret
          ansible.builtin.include_role:
            name: sops_secret
          vars:
            sops_secret_target: >-
              {{ observability_secrets_dir }}/grafana-admin.sops.yaml
            sops_secret_format: yaml
            sops_secret_plaintext: >-
              {{ {'apiVersion': 'v1',
                  'kind': 'Secret',
                  'metadata': {'name': 'grafana-admin',
                               'namespace': 'observability'},
                  'type': 'Opaque',
                  'stringData': {'admin-user': 'admin',
                                 'admin-password': rotate_password}}
                 | to_nice_yaml }}
            sops_secret_expected: >-
              {{ {'apiVersion': 'v1',
                  'kind': 'Secret',
                  'metadata': {'name': 'grafana-admin',
                               'namespace': 'observability'},
                  'type': 'Opaque',
                  'stringData': {'admin-user': 'admin',
                                 'admin-password': rotate_password}} | to_json }}
          no_log: true

        - name: Restart Grafana
          ansible.builtin.command:
            argv:
              - kubectl
              - rollout
              - restart
              - deployment/prometheus-stack-grafana
              - -n
              - observability
          register: rotate_grafana_restart
          changed_when: rotate_grafana_restart.rc == 0
          failed_when: false

        - name: Report the Grafana follow-up
          ansible.builtin.debug:
            msg: >-
              {{ 'Grafana restarted with the new secret.'
                 if rotate_grafana_restart.rc == 0
                 else 'Store rotated, but the restart failed. Run:
                 kubectl rollout restart deployment/prometheus-stack-grafana -n observability' }}
              If the admin user already existed, the secret may not change its
              password; use `grafana cli admin reset-admin-password` or the UI.
