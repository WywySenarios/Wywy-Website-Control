---
- name: Populate missing master-database application secrets
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars_files:
    - ../../../../vars/secrets.yaml

  vars:
    sops_secret_verify: false
    populate_directories:
      - { path: "{{ master_database_secrets_dir }}", mode: "0775" }
    populate_secrets:
      - name: app-password
        namespace: master-database
        target: "{{ master_database_secrets_dir }}/app-password.sops.yaml"
        key: password
        followup: Run playbooks/db/seed.yaml, then restart the master-database application.
      - name: migrator-password
        namespace: master-database
        target: "{{ master_database_secrets_dir }}/migrator-password.sops.yaml"
        key: password
        followup: Run playbooks/db/seed.yaml, then rerun migrations.
      - name: master-db-admin
        namespace: master-database
        target: "{{ master_database_secrets_dir }}/master-db-admin.sops.yaml"
        key: password
        followup: Re-run the master-database `db-setup` job to upsert the admin account.

  tasks:
    - name: Ensure the master-database secret directories exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        mode: "{{ item.mode }}"
      loop: "{{ populate_directories }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Check the generated master-database secret targets
      ansible.builtin.stat:
        path: "{{ item.target }}"
      loop: "{{ populate_secrets }}"
      register: populate_stats

    - name: Generate the missing master-database secrets
      ansible.builtin.include_role:
        name: sops_secret
        tasks_from: rotate-secret
      vars:
        sops_secret_rotate_target: "{{ item.item.target }}"
        sops_secret_rotate_name: "{{ item.item.name }}"
        sops_secret_rotate_namespace: "{{ item.item.namespace }}"
        sops_secret_rotate_key: "{{ item.item.key }}"
        sops_secret_rotate_followup: "{{ item.item.followup }}"
      loop: "{{ populate_stats.results }}"
      when: not item.stat.exists
      loop_control:
        label: "{{ item.item.name }}"
