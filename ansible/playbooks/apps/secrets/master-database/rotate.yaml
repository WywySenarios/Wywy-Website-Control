---
# Rotate: master-db-app, master-db-migrator, master-db-admin
#
# Additional steps:
#   master-db-app:
#     1. run `playbooks/db/seed.yaml`
#     2. restart the master-database application.
#   master-db-migrator:
#     1. run `playbooks/db/seed.yaml`.
#     2. it is recommended to re-run the master-database `db-setup` job to validate the rotation.
#   master-db-admin: re-run the master-database `db-setup` job.

- name: Rotate one master-database application secret
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars_files:
    - ../../../../vars/secrets.yaml

  vars:
    valid_rotation_tags:
      - master-db-app
      - master-db-migrator
      - master-db-admin

  tasks:
    - name: Validate the rotation tag
      ansible.builtin.include_role:
        name: sops_secret
        tasks_from: validate-rotation-tag
      tags: always

    - name: Rotate the master-database application password
      tags: master-db-app
      block:
        - name: Rotate the master-database application role password
          ansible.builtin.include_role:
            name: sops_secret
            tasks_from: rotate-secret
          vars:
            sops_secret_rotate_target: >-
              {{ master_database_secrets_dir }}/app-password.sops.yaml
            sops_secret_rotate_name: app-password
            sops_secret_rotate_namespace: master-database
            sops_secret_rotate_followup: >-
              {{ rotate_db_followup }} Restart the master-database application.

    - name: Rotate the master-database migrator password
      tags: master-db-migrator
      block:
        - name: Rotate the master-database migrator role password
          ansible.builtin.include_role:
            name: sops_secret
            tasks_from: rotate-secret
          vars:
            sops_secret_rotate_target: >-
              {{ master_database_secrets_dir }}/migrator-password.sops.yaml
            sops_secret_rotate_name: migrator-password
            sops_secret_rotate_namespace: master-database
            sops_secret_rotate_followup: >-
              {{ rotate_db_followup }} Restart the master-database migrations.

    - name: Rotate the master-database admin password
      tags: master-db-admin
      block:
        - name: Rotate the master-database admin password
          ansible.builtin.include_role:
            name: sops_secret
            tasks_from: rotate-secret
          vars:
            sops_secret_rotate_target: >-
              {{ master_database_secrets_dir }}/master-db-admin.sops.yaml
            sops_secret_rotate_name: master-db-admin
            sops_secret_rotate_namespace: master-database
            sops_secret_rotate_followup: >-
              Re-run the master-database `db-setup` job to upsert the admin
              account from the new secret.
