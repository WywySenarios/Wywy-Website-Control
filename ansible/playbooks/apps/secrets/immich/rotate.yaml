---
# Rotate: immich-db
#
# Additional steps:
#   immich-db: run `playbooks/db/seed.yaml`, then restart the immich-server deployment.

- name: Rotate the Immich database password
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars_files:
    - ../../../../vars/secrets.yaml

  vars:
    valid_rotation_tags:
      - immich-db

  tasks:
    - name: Validate the rotation tag
      ansible.builtin.include_role:
        name: sops_secret
        tasks_from: validate-rotation-tag
      tags: always

    - name: Rotate the Immich database password
      tags: immich-db
      block:
        - name: Rotate the Immich role password
          ansible.builtin.include_role:
            name: sops_secret
            tasks_from: rotate-secret
          vars:
            sops_secret_rotate_target: >-
              {{ immich_secrets_dir }}/immich-db-password.sops.yaml
            sops_secret_rotate_name: immich-db-password
            sops_secret_rotate_namespace: immich
            sops_secret_rotate_followup: >-
              {{ rotate_db_followup }} Restart the immich-server deployment.
