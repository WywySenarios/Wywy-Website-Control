---
# Rotate: nextcloud-admin, nextcloud-db
#
# Additional steps:
#   nextcloud-admin: `occ user:resetpassword admin`.
#   nextcloud-db:
#     1. run `playbooks/db/seed.yaml`
#     2. wait for Argo CD to sync `nextcloud-db-password`
#     3. run `scripts/nextcloud-set-dbpassword.sh`
#     4. restart the deployment

- name: Rotate one Nextcloud secret
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars_files:
    - ../../../../vars/secrets.yaml

  vars:
    valid_rotation_tags:
      - nextcloud-admin
      - nextcloud-db

  tasks:
    - name: Validate the rotation tag
      ansible.builtin.include_role:
        name: sops_secret
        tasks_from: validate-rotation-tag
      tags: always

    - name: Rotate the Nextcloud admin password
      tags: nextcloud-admin
      block:
        - name: Rotate the Nextcloud admin password
          ansible.builtin.include_role:
            name: sops_secret
            tasks_from: rotate-secret
          vars:
            sops_secret_rotate_target: >-
              {{ nextcloud_secrets_dir }}/nextcloud-admin-password.sops.yaml
            sops_secret_rotate_name: nextcloud-admin-password
            sops_secret_rotate_namespace: nextcloud
            sops_secret_rotate_followup: >-
              The secret only applies on first boot. Update the existing admin
              with `kubectl -n nextcloud exec deploy/nextcloud -- occ
              user:resetpassword admin` (or the UI).

    - name: Rotate the Nextcloud database password
      tags: nextcloud-db
      block:
        - name: Rotate the Nextcloud role password
          ansible.builtin.include_role:
            name: sops_secret
            tasks_from: rotate-secret
          vars:
            sops_secret_rotate_target: >-
              {{ nextcloud_secrets_dir }}/nextcloud-db-password.sops.yaml
            sops_secret_rotate_name: nextcloud-db-password
            sops_secret_rotate_namespace: nextcloud
            sops_secret_rotate_followup: >-
              {{ rotate_db_followup }} Nextcloud does not re-read the secret
              after first boot. After Argo CD syncs `nextcloud-db-password`,
              run `scripts/nextcloud-set-dbpassword.sh`, then restart the
              Nextcloud deployment.
