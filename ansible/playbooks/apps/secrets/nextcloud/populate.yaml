---
- name: Populate missing Nextcloud secrets
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars_files:
    - ../../../../vars/secrets.yaml

  vars:
    sops_secret_verify: false
    populate_directories:
      - { path: "{{ nextcloud_secrets_dir }}", mode: "0775" }
    populate_secrets:
      - name: nextcloud-admin-password
        namespace: nextcloud
        target: "{{ nextcloud_secrets_dir }}/nextcloud-admin-password.sops.yaml"
        key: password
        followup: Nextcloud may not re-read it after first boot; update via the UI or `occ user:resetpassword admin`.
      - name: nextcloud-db-password
        namespace: nextcloud
        target: "{{ nextcloud_secrets_dir }}/nextcloud-db-password.sops.yaml"
        key: password
        followup: Run playbooks/db/seed.yaml, then set the password inside Nextcloud.

  tasks:
    - name: Ensure the Nextcloud secret directory exists
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        mode: "{{ item.mode }}"
      loop: "{{ populate_directories }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Check the generated Nextcloud secret targets
      ansible.builtin.stat:
        path: "{{ item.target }}"
      loop: "{{ populate_secrets }}"
      register: populate_stats

    - name: Generate the missing Nextcloud secrets
      ansible.builtin.include_role:
        name: sops_secret
        tasks_from: rotate-secret
      vars:
        sops_secret_rotate_target: "{{ item.item.target }}"
        sops_secret_rotate_name: "{{ item.item.name }}"
        sops_secret_rotate_namespace: "{{ item.item.namespace }}"
        sops_secret_rotate_key: "{{ item.item.key }}"
        sops_secret_rotate_followup: "{{ item.item.followup }}"
      loop: "{{ populate_stats.results }}"
      when: not item.stat.exists
      loop_control:
        label: "{{ item.item.name }}"
