---
# Rotate: vaultwarden-admin-token, vaultwarden-db
#
# Additional steps:
#   vaultwarden-admin-token: restart Vaultwarden.
#   vaultwarden-db: run `playbooks/db/seed.yaml`, then restart Vaultwarden.

- name: Rotate one Vaultwarden secret
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars_files:
    - ../../../../vars/secrets.yaml

  vars:
    valid_rotation_tags:
      - vaultwarden-admin-token
      - vaultwarden-db

  tasks:
    - name: Validate the rotation tag
      ansible.builtin.include_role:
        name: sops_secret
        tasks_from: validate-rotation-tag
      tags: always

    - name: Rotate the Vaultwarden admin token
      tags: vaultwarden-admin-token
      block:
        - name: Rotate the Vaultwarden admin token
          ansible.builtin.include_role:
            name: sops_secret
            tasks_from: rotate-secret
          vars:
            sops_secret_rotate_target: >-
              {{ vaultwarden_secrets_dir }}/vaultwarden-admin-token.sops.yaml
            sops_secret_rotate_name: vaultwarden-admin-token
            sops_secret_rotate_namespace: vaultwarden
            sops_secret_rotate_key: admin-token
            sops_secret_rotate_followup: >-
              Restart the vaultwarden deployment to load the new admin token.

        - name: Restart Vaultwarden
          ansible.builtin.command:
            argv:
              - kubectl
              - rollout
              - restart
              - deployment/vaultwarden
              - -n
              - vaultwarden
          register: rotate_vaultwarden_restart
          changed_when: rotate_vaultwarden_restart.rc == 0
          failed_when: false

        - name: Report the Vaultwarden follow-up
          ansible.builtin.debug:
            msg: >-
              {{ 'Vaultwarden restarted with the new admin token.'
                 if rotate_vaultwarden_restart.rc == 0
                 else 'Store rotated, but the restart failed. Run:
                 kubectl rollout restart deployment/vaultwarden -n vaultwarden' }}

    - name: Rotate the Vaultwarden database password
      tags: vaultwarden-db
      block:
        - name: Rotate the Vaultwarden role password
          ansible.builtin.include_role:
            name: sops_secret
            tasks_from: rotate-secret
          vars:
            sops_secret_rotate_target: >-
              {{ vaultwarden_secrets_dir }}/vaultwarden-db-password.sops.yaml
            sops_secret_rotate_name: vaultwarden-db-password
            sops_secret_rotate_namespace: vaultwarden
            sops_secret_rotate_followup: >-
              {{ rotate_db_followup }} Restart the vaultwarden deployment.
