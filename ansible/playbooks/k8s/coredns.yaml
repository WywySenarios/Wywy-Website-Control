---
- name: Resolve external host names inside the cluster
  hosts: k8s_control_plane
  become: true
  gather_facts: false
  tasks:
    - name: Install the CoreDNS host entries
      ansible.builtin.include_role:
        name: k8s_network
        tasks_from: coredns
      when: inventory_hostname == k8s_control_plane_init_host
