---
- name: Create the Kubernetes control-plane VMs from their templates
  hosts: k8s_control_plane_pve
  become: false
  gather_facts: false
  serial: 1
  roles:
    - proxmox_vm

- name: Wait for the control-plane VMs to accept SSH
  hosts: k8s_control_plane
  gather_facts: false
  tasks:
    - name: Wait for SSH on the clone
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 300
