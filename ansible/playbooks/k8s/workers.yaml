---
# TEMPORARY: worker nodes are still cloud-init-managed and are not part of the long-term Ansible worker role.
# This playbook only wires the minimum registry DNS/CA trust required for Jenkins.
# It will be swallowed by the worker-role work when the workers move to Ansible.
- name: Wire registry DNS and CA trust on K8s workers (temporary)
  hosts: k8s_workers
  become: true
  gather_facts: false
  serial: 1

  vars:
    registry_ip: >-
      {{ lookup('pipe', control_dir ~ '/scripts/lib/hosts-lookup.sh ' ~
      control_dir ~ '/secrets/' ~ wywy_env ~ '/hosts.sops registry.internal') | trim }}

  tasks:
    - name: Check for Python on the worker
      ansible.builtin.raw: command -v python3
      register: worker_python
      changed_when: false
      failed_when: false

    - name: Install Python for Ansible
      ansible.builtin.raw: apt-get update && apt-get install -y python3
      when: worker_python.rc != 0
      changed_when: true

    - name: Read the internal root CA bundle from its sops store
      ansible.builtin.command:
        argv:
          - sops
          - -d
          - --output-type
          - binary
          - "{{ control_dir }}/secrets/{{ wywy_env }}/internal-ca.sops"
      delegate_to: localhost
      become: false
      changed_when: false
      check_mode: false
      no_log: true
      register: worker_ca_bundle

    - name: Parse the internal root CA certificate
      ansible.builtin.set_fact:
        worker_ca_cert: "{{ (worker_ca_bundle.stdout | from_yaml).cert }}"
      no_log: true

    - name: Point registry.internal at the registry VM
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^[^#]*\bregistry\.internal\b'
        line: "{{ registry_ip }} registry.internal"
        owner: root
        group: root
        mode: "0644"
        state: present

    - name: Ensure the containerd registry certs directory exists
      ansible.builtin.file:
        path: /etc/containerd/certs.d/registry.internal:5000
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install the internal CA for containerd
      ansible.builtin.copy:
        content: "{{ worker_ca_cert }}"
        dest: /etc/containerd/certs.d/registry.internal:5000/ca.crt
        owner: root
        group: root
        mode: "0644"
      no_log: true
      notify: Restart containerd

    - name: Point containerd at the certs.d directory
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: '(?s)(\[plugins\."io\.containerd\.grpc\.v1\.cri"\.registry\]\s*\n\s*config_path\s*=\s*)""'
        replace: '\1"/etc/containerd/certs.d"'
      notify: Restart containerd

    - name: Verify registry.internal resolves on the worker
      ansible.builtin.command:
        argv:
          - getent
          - hosts
          - registry.internal
      register: worker_registry_lookup
      changed_when: false
      failed_when: worker_registry_lookup.rc != 0

    - name: Verify the containerd CA certificate is installed
      ansible.builtin.stat:
        path: /etc/containerd/certs.d/registry.internal:5000/ca.crt
      register: worker_registry_ca
      failed_when: not worker_registry_ca.stat.exists

    - name: Read the containerd configuration
      ansible.builtin.slurp:
        src: /etc/containerd/config.toml
      register: worker_containerd_config

    - name: Verify the containerd certs.d path
      ansible.builtin.assert:
        that:
          - '''config_path = "/etc/containerd/certs.d"'' in (worker_containerd_config.content | b64decode)'
        quiet: true

  handlers:
    - name: Restart containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted
