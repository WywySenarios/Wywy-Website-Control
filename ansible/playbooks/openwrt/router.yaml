---
- name: Resolve the OpenWrt network identifiers
  hosts: openwrt
  gather_facts: false
  become: false

  tasks:
    - name: Assert the operator MAC is present
      ansible.builtin.assert:
        that:
          - openwrt_operator_mac | default('') | trim | length > 0
        fail_msg: >-
          openwrt_operator_mac is missing from the encrypted openwrt
          inventory.
        quiet: true

    - name: Read the current DHCPv6 DUID
      ansible.builtin.raw: "uci get network.globals.dhcp_default_duid"
      register: openwrt_current_duid
      changed_when: false
      failed_when: false

    - name: Read the current ULA prefix
      ansible.builtin.raw: "uci get network.globals.ula_prefix"
      register: openwrt_current_ula
      changed_when: false
      failed_when: false

    - name: Read the current Wi-Fi PSK
      when: wywy_env == 'dev'
      ansible.builtin.raw: "uci get wireless.default_radio0.key"
      register: openwrt_current_wifi_key
      changed_when: false
      failed_when: false

    - name: Record whether the Wi-Fi PSK needs persisting
      when: wywy_env == 'dev'
      ansible.builtin.set_fact:
        openwrt_wifi_key_missing: >-
          {{ openwrt_wifi_key | default('', true) | trim | length == 0 }}

    - name: Record whether the network identifiers need persisting
      ansible.builtin.set_fact:
        openwrt_network_secrets_missing: >-
          {{ (openwrt_dhcp_default_duid | default('', true) | trim | length == 0)
             or (openwrt_ula_prefix | default('', true) | trim | length == 0)
             or (wywy_env == 'dev'
                 and (openwrt_wifi_key_missing | default(false) | bool)) }}

    - name: Generate a ULA prefix when neither the inventory nor router has one
      ansible.builtin.set_fact:
        openwrt_generated_ula_hex: >-
          {{ lookup('community.general.random_string',
             length=10, override_all='0123456789abcdef') }}
      when:
        - openwrt_ula_prefix | default('', true) | trim | length == 0
        - openwrt_current_ula.stdout | default('') | trim | length == 0

    - name: Populate the DHCPv6 DUID and ULA prefix
      ansible.builtin.set_fact:
        openwrt_dhcp_default_duid: >-
          {{ openwrt_dhcp_default_duid | default('', true) | trim
             or openwrt_current_duid.stdout | default('') | trim
             or '0004' ~ lookup('community.general.random_string',
                length=32, override_all='0123456789abcdef') }}
        openwrt_ula_prefix: >-
          {{ openwrt_ula_prefix | default('', true) | trim
             or openwrt_current_ula.stdout | default('') | trim
             or ('fd' ~ (openwrt_generated_ula_hex | default('0000000000'))[0:2]
                ~ ':' ~ (openwrt_generated_ula_hex | default('0000000000'))[2:6]
                ~ ':' ~ (openwrt_generated_ula_hex | default('0000000000'))[6:10]
                ~ '::/48') }}

    - name: Populate the Wi-Fi PSK
      when: wywy_env == 'dev'
      ansible.builtin.set_fact:
        openwrt_wifi_key: >-
          {{ openwrt_wifi_key | default('', true) | trim
             or openwrt_current_wifi_key.stdout | default('') | trim
             or lookup('pipe', 'openssl rand -hex 16') | trim }}

    - name: Validate the DHCPv6 DUID and ULA prefix
      ansible.builtin.assert:
        that:
          - openwrt_dhcp_default_duid is match('^[0-9a-fA-F]{36}$')
          - >-
            openwrt_ula_prefix is match(
            '^[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}::/48$')
        fail_msg: >-
          invalid DHCPv6 DUID or ULA prefix:
          {{ openwrt_dhcp_default_duid }} {{ openwrt_ula_prefix }}
        quiet: true

    - name: Validate the Wi-Fi PSK
      when: wywy_env == 'dev'
      ansible.builtin.assert:
        that:
          - openwrt_wifi_key | length >= 8
          - openwrt_wifi_key is match('^\S+$')
        fail_msg: >-
          invalid Wi-Fi PSK: it must be at least 8 characters and contain no
          whitespace.
        quiet: true

- name: Persist the OpenWrt network identifiers
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars_files:
    - ../../vars/secrets.yaml

  vars:
    openwrt_inventory_target: >-
      {{ control_dir }}/ansible/inventory/{{ wywy_env }}/group_vars/openwrt.sops.yaml
    openwrt_network_secrets: >-
      {{ {
           'openwrt_operator_mac':
             hostvars[groups['openwrt'][0]].openwrt_operator_mac | default(''),
           'openwrt_dhcp_default_duid':
             hostvars[groups['openwrt'][0]].openwrt_dhcp_default_duid | default(''),
           'openwrt_ula_prefix':
             hostvars[groups['openwrt'][0]].openwrt_ula_prefix | default('')
         }
         | combine(
           {'openwrt_wifi_key':
             hostvars[groups['openwrt'][0]].openwrt_wifi_key | default('')}
           if wywy_env == 'dev' else {}
         ) }}

  tasks:
    - name: Store generated network identifiers in sops
      when: >-
        hostvars[groups['openwrt'][0]].openwrt_network_secrets_missing
        | default(false) | bool
      no_log: true
      ansible.builtin.include_role:
        name: sops_secret
      vars:
        sops_secret_target: "{{ openwrt_inventory_target }}"
        sops_secret_format: yaml
        sops_secret_plaintext: "{{ openwrt_network_secrets | to_nice_yaml }}"
        sops_secret_expected: "{{ openwrt_network_secrets | to_json }}"

- name: Apply the OpenWrt router configuration
  hosts: openwrt
  gather_facts: false
  become: false

  vars:
    router_config_templates:
      - attendedsysupgrade
      - dhcp
      - dropbear
      - firewall
      - luci
      - network
      - rpcd
      - system
      - ubihealthd
      - uhttpd
    router_dev_config_templates:
      - wireless
    openwrt_terraform_env_dir: "{{ control_dir }}/terraform/proxmox/env"
    openwrt_terraform_env: >-
      {{ lookup('file', openwrt_terraform_env_dir ~ '/base/proxmox.yaml')
         | from_yaml
         | combine(
             lookup('file',
                    openwrt_terraform_env_dir ~ '/' ~ wywy_env ~ '/proxmox.yaml')
             | from_yaml,
             recursive=true) }}
    openwrt_internal_service_vms:
      db.internal: database_vm
      files.internal: files_vm
      registry.internal: registry_vm
    openwrt_internal_vm_hosts: >-
      {{ (groups['db'] | default([]))
         + (groups['files'] | default([]))
         + (groups['registry'] | default([]))
         + (groups['k8s_control_plane'] | default([]))
         + (groups['k8s_workers'] | default([])) }}
    openwrt_internal_dns_records: >-
      {{ (query('wywy_internal_dns',
                openwrt_terraform_env,
                service_vms=openwrt_internal_service_vms,
                vm_hosts=openwrt_internal_vm_hosts)
          + [{'name': k8s_api_hostname, 'address': k8s_api_vip}])
         | sort(attribute='name') }}

  tasks:
    - name: Apply each router configuration file
      ansible.builtin.include_role:
        name: openwrt_router
        tasks_from: apply-file
      loop: >-
        {{ router_config_templates
           + (router_dev_config_templates if wywy_env == 'dev' else []) }}
      loop_control:
        label: "{{ item }}"

    - name: Remove the Wi-Fi configuration outside dev
      when: wywy_env != 'dev'
      ansible.builtin.raw: >-
        if [ -e /etc/config/wireless ]; then
          rm -f /etc/config/wireless;
          echo changed;
        fi
      register: openwrt_wireless_removed
      changed_when: "'changed' in openwrt_wireless_removed.stdout"

    - name: Mark the router configuration changed after Wi-Fi removal
      when:
        - wywy_env != 'dev'
        - "'changed' in (openwrt_wireless_removed.stdout | default(''))"
      ansible.builtin.set_fact:
        router_config_changed: true

    - name: Reboot the router
      when: router_config_changed | default(false) | bool
      ansible.builtin.raw: "trap '' HUP; (sleep 2; reboot) >/dev/null 2>&1 &"
      changed_when: true

    - name: Wait for the router to stop
      when: router_config_changed | default(false) | bool
      ansible.builtin.wait_for:
        host: "{{ inventory_hostname }}"
        port: 22
        state: stopped
        delay: 0
        timeout: 60
      delegate_to: localhost

    - name: Wait for the router to come back
      when: router_config_changed | default(false) | bool
      ansible.builtin.wait_for:
        host: "{{ inventory_hostname }}"
        port: 22
        state: started
        delay: 2
        timeout: 180
      delegate_to: localhost
