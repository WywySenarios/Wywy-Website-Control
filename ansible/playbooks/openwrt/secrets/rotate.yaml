---
# Rotate: uapi-token
#
# Additional steps: N/A

- name: Rotate the OpenWrt uapi token
  hosts: openwrt
  gather_facts: false
  become: false

  vars_files:
    - ../../../vars/secrets.yaml

  vars:
    valid_rotation_tags:
      - uapi-token
    uapi_token_name: terraform
    openwrt_uapi_secret_path: "{{ secrets_dir }}/openwrt/uapi.sops"

  tasks:
    - name: Validate the rotation tag
      ansible.builtin.include_role:
        name: sops_secret
        tasks_from: validate-rotation-tag
      tags: always

    - name: Rotate the uapi token
      tags: uapi-token
      block:
        - name: Revoke the existing token
          ansible.builtin.include_role:
            name: uapi_token
            tasks_from: revoke

        - name: Create the token
          ansible.builtin.include_role:
            name: uapi_token
            tasks_from: create

- name: Store the rotated OpenWrt uapi token
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars_files:
    - ../../../vars/secrets.yaml

  vars:
    openwrt_uapi_secret_path: "{{ secrets_dir }}/openwrt/uapi.sops"
    openwrt_uapi_token_create: >-
      {{ hostvars[groups['openwrt'][0]].openwrt_uapi_token_create | default({}) }}
    openwrt_uapi_token: >-
      {{ (openwrt_uapi_token_create.stdout_lines | default([]) | first | default('')) | trim }}

  tasks:
    - name: Ensure the OpenWrt secret directory exists
      ansible.builtin.file:
        path: "{{ openwrt_uapi_secret_path | dirname }}"
        state: directory
        mode: "0750"
      when: openwrt_uapi_token | length > 0

    - name: Store the token in sops
      when: openwrt_uapi_token | length > 0
      no_log: true
      ansible.builtin.include_role:
        name: sops_secret
      vars:
        sops_secret_target: "{{ openwrt_uapi_secret_path }}"
        sops_secret_format: binary
        sops_secret_plaintext: "{{ openwrt_uapi_token }}"
        sops_secret_expected: "{{ openwrt_uapi_token }}"

    - name: Report the OpenWrt follow-up
      ansible.builtin.debug:
        msg: >-
          Token rotated. Terraform reads the token from
          {{ openwrt_uapi_secret_path }} on its next run.
