---
- name: Populate the OpenWrt uapi token
  hosts: openwrt
  gather_facts: false
  become: false

  vars_files:
    - ../../../vars/secrets.yaml

  vars:
    uapi_token_name: terraform
    openwrt_uapi_secret_path: "{{ secrets_dir }}/openwrt/uapi.sops"

  tasks:
    - name: Check whether the token exists
      ansible.builtin.include_role:
        name: uapi_token
        tasks_from: check

    - name: Check whether the encrypted secret exists
      ansible.builtin.stat:
        path: "{{ openwrt_uapi_secret_path }}"
      register: openwrt_uapi_secret
      delegate_to: localhost

    - name: Refuse to overwrite a missing secret for an existing token
      ansible.builtin.assert:
        that:
          - not (openwrt_uapi_token_show.rc == 0 and not openwrt_uapi_secret.stat.exists)
        fail_msg: >-
          uapi-token {{ uapi_token_name }} exists on the router but
          {{ openwrt_uapi_secret_path }} is missing. Rotate the token with
          `playbooks/openwrt/secrets/rotate.yaml --tags uapi-token`, then rerun.
        quiet: true

    - name: Create the token
      when: openwrt_uapi_token_show.rc != 0
      ansible.builtin.include_role:
        name: uapi_token
        tasks_from: create

- name: Store the OpenWrt uapi token
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars_files:
    - ../../../vars/secrets.yaml

  vars:
    openwrt_uapi_secret_path: "{{ secrets_dir }}/openwrt/uapi.sops"
    openwrt_uapi_token_create: >-
      {{ hostvars[groups['openwrt'][0]].openwrt_uapi_token_create | default({}) }}
    openwrt_uapi_token: >-
      {{ (openwrt_uapi_token_create.stdout_lines | default([]) | first | default('')) | trim }}

  tasks:
    - name: Ensure the OpenWrt secret directory exists
      ansible.builtin.file:
        path: "{{ openwrt_uapi_secret_path | dirname }}"
        state: directory
        mode: "0750"
      when: openwrt_uapi_token | length > 0

    - name: Store the token in sops
      when: openwrt_uapi_token | length > 0
      no_log: true
      ansible.builtin.include_role:
        name: sops_secret
      vars:
        sops_secret_target: "{{ openwrt_uapi_secret_path }}"
        sops_secret_format: binary
        sops_secret_plaintext: "{{ openwrt_uapi_token }}"
        sops_secret_expected: "{{ openwrt_uapi_token }}"
