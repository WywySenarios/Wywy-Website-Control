---
- name: Provision public Cloudflare tunnels
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    control_dir: "{{ ansible_config_file | dirname | dirname }}"
    wywy_env: "{{ ansible_inventory_sources | first | basename }}"

  tasks:
    - name: Validate the target environment
      ansible.builtin.assert:
        that:
          - wywy_env in ['dev', 'prod']
        fail_msg: >-
          wywy_env must be 'dev' or 'prod' (got '{{ wywy_env }}').
        quiet: true

    - name: Require public host definitions
      ansible.builtin.assert:
        that:
          - cloudflare_public_hosts is defined
          - (cloudflare_public_hosts | default([])) | length > 0
        fail_msg: >-
          cloudflare_public_hosts is empty or undefined. Define it in
          ansible/inventory/{{ wywy_env }}/group_vars/all.yaml.
        quiet: true

    - name: Validate the public host entries
      ansible.builtin.assert:
        that:
          - (item.name | default('')) | length > 0
          - (item.hostname | default('')) | length > 0
          - (item.namespace | default('')) | length > 0
          - (item.service | default('')) | length > 0
        fail_msg: >-
          Each cloudflare_public_hosts entry needs non-empty name, hostname,
          namespace, and service fields.
        quiet: true
      loop: "{{ cloudflare_public_hosts }}"
      loop_control:
        label: "{{ item.name | default('<missing name>') }}"

    - name: Provision each public tunnel
      ansible.builtin.include_role:
        name: cloudflare_tunnel
      vars:
        cloudflare_tunnel_name: "{{ item.name }}"
        cloudflare_tunnel_hostname: "{{ item.hostname }}"
        cloudflare_tunnel_namespace: "{{ item.namespace }}"
        cloudflare_tunnel_service: "{{ item.service }}"
        cloudflare_tunnel_token_secret_dir: >-
          {{ control_dir }}/k8s/{{ wywy_env }}/cloudflared/{{ item.namespace }}/secrets
      loop: "{{ cloudflare_public_hosts }}"
      loop_control:
        label: "{{ item.hostname }}"
