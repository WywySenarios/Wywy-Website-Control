---
# Rotate: cloudflared-tunnel-token
#
# Additional steps:
#   1. Replace the tunnel first; Terraform creates a new tunnel ID and token:
#      scripts/terraform.sh --<env> apply \
#        -replace='module.cloudflare.cloudflare_zero_trust_tunnel_cloudflared.this["<tunnel>"]'
#   2. Run this playbook to write the new token and restart cloudflared.
#
# Narrow to one namespace with `-e tunnel_namespace=<namespace>`.

- name: Rotate Cloudflare tunnel token secrets
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars_files:
    - ../../../vars/secrets.yaml

  vars:
    valid_rotation_tags:
      - cloudflared-tunnel-token
    cloudflare_secrets: "{{ control_dir }}/secrets/{{ wywy_env }}/cloudflare.sops.yaml"
    cloudflare_api_token: >-
      {{ lookup('community.sops.sops', cloudflare_secrets,
               extract='["cloudflare_api_token"]') }}
    cloudflare_account_id: >-
      {{ lookup('community.sops.sops', cloudflare_secrets,
               extract='["cloudflare_account_id"]') }}
    cloudflare_env_dir: "{{ control_dir }}/terraform/cloudflare/env"
    cloudflare_public_hosts: >-
      {{ (lookup('file',
                 cloudflare_env_dir ~ '/' ~ wywy_env ~ '/cloudflare.yaml')
          | from_yaml).public_hosts }}

  tasks:
    - name: Validate the rotation tag
      ansible.builtin.include_role:
        name: sops_secret
        tasks_from: validate-rotation-tag
      tags: always

    - name: Rotate the Cloudflare tunnel tokens
      tags: cloudflared-tunnel-token
      block:
        - name: Validate the optional tunnel namespace
          ansible.builtin.assert:
            that:
              - >-
                tunnel_namespace in (cloudflare_public_hosts | dict2items
                | map(attribute='value') | map(attribute='namespace')
                | list)
            fail_msg: >-
              tunnel_namespace must be one of the namespaces in the Terraform
              Cloudflare environment contract.
            quiet: true
          when: tunnel_namespace is defined

        - name: Rotate the selected tunnel tokens
          ansible.builtin.include_role:
            name: cloudflare_tunnel_token
          vars:
            cloudflare_tunnel_token_name: "{{ item.key }}"
            cloudflare_tunnel_token_namespace: "{{ item.value.namespace }}"
            cloudflare_tunnel_token_secret_dir: >-
              {{ control_dir }}/k8s/{{ wywy_env }}/cloudflared/{{
                 item.value.namespace }}/secrets
            cloudflare_tunnel_token_force_write: true
          loop: "{{ cloudflare_public_hosts | dict2items }}"
          loop_control:
            label: "{{ item.key }}"
          when: tunnel_namespace is not defined or item.value.namespace == tunnel_namespace

        - name: Restart the rotated cloudflared deployments
          ansible.builtin.command:
            argv:
              - kubectl
              - rollout
              - restart
              - deployment/cloudflared
              - -n
              - "{{ item.value.namespace }}"
          loop: "{{ cloudflare_public_hosts | dict2items }}"
          loop_control:
            label: "{{ item.value.namespace }}"
          when: tunnel_namespace is not defined or item.value.namespace == tunnel_namespace
          register: rotate_cloudflared_restart
          changed_when: rotate_cloudflared_restart.rc == 0
          failed_when: false

        - name: Report the Cloudflare follow-up
          ansible.builtin.debug:
            msg: >-
              Tokens rotated. If a cloudflared restart failed, run
              `kubectl rollout restart deployment/cloudflared -n <namespace>`.
