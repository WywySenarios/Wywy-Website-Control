---
# Rotate: cloudflared-tunnel-token
#
# Narrow to one namespace with `-e tunnel_namespace=<namespace>`.
#
# Additional steps: Restart the cloudflared pods.

- name: Rotate Cloudflare tunnel tokens
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars_files:
    - ../../../vars/secrets.yaml

  vars:
    valid_rotation_tags:
      - cloudflared-tunnel-token

  tasks:
    - name: Validate the rotation tag
      ansible.builtin.include_role:
        name: sops_secret
        tasks_from: validate-rotation-tag
      tags: always

    - name: Rotate the Cloudflare tunnel tokens
      tags: cloudflared-tunnel-token
      block:
        - name: Validate the optional tunnel namespace
          ansible.builtin.assert:
            that:
              - >-
                tunnel_namespace in (cloudflare_public_hosts
                | map(attribute='namespace') | list)
            fail_msg: >-
              tunnel_namespace must be one of the namespaces in
              cloudflare_public_hosts.
            quiet: true
          when: tunnel_namespace is defined

        - name: Rotate the selected tunnel tokens
          ansible.builtin.include_role:
            name: cloudflare_tunnel
          vars:
            cloudflare_tunnel_name: "{{ item.name }}"
            cloudflare_tunnel_hostname: "{{ item.hostname }}"
            cloudflare_tunnel_namespace: "{{ item.namespace }}"
            cloudflare_tunnel_service: "{{ item.service }}"
            cloudflare_tunnel_token_secret_dir: >-
              {{ control_dir }}/k8s/{{ wywy_env }}/cloudflared/{{ item.namespace }}/secrets
            cloudflare_tunnel_force_token: true
          loop: "{{ cloudflare_public_hosts }}"
          loop_control:
            label: "{{ item.hostname }}"
          when: tunnel_namespace is not defined or item.namespace == tunnel_namespace

        - name: Restart the rotated cloudflared deployments
          ansible.builtin.command:
            argv:
              - kubectl
              - rollout
              - restart
              - deployment/cloudflared
              - -n
              - "{{ item.namespace }}"
          loop: "{{ cloudflare_public_hosts }}"
          loop_control:
            label: "{{ item.namespace }}"
          when: tunnel_namespace is not defined or item.namespace == tunnel_namespace
          register: rotate_cloudflared_restart
          changed_when: rotate_cloudflared_restart.rc == 0
          failed_when: false

        - name: Report the Cloudflare follow-up
          ansible.builtin.debug:
            msg: >-
              Tokens rotated. If a cloudflared restart failed, run
              `kubectl rollout restart deployment/cloudflared -n <namespace>`.
