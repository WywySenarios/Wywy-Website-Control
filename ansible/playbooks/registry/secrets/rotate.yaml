---
# Rotate: registry-password
#
# Additional steps:
#   1. Run `playbooks/registry/registry.yaml`.
#   2. Run `playbooks/registry/secrets/derive.yaml`.
#   3. Run `playbooks/jenkins/secrets/derive.yaml`.
#   4. Run `playbooks/jenkins/images.yaml`.

- name: Rotate the registry password
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars_files:
    - ../../../vars/secrets.yaml

  vars:
    valid_rotation_tags:
      - registry-password
    inventory_secrets: >-
      {{ control_dir }}/ansible/inventory/{{ wywy_env }}/group_vars/all.sops.yaml

  tasks:
    - name: Validate the rotation tag
      ansible.builtin.include_role:
        name: sops_secret
        tasks_from: validate-rotation-tag
      tags: always

    - name: Rotate the registry password
      tags: registry-password
      block:
        - name: Generate the registry password
          ansible.builtin.set_fact:
            rotate_password: >-
              {{ lookup('pipe', 'openssl rand -base64 32') | trim }}
          no_log: true

        - name: Store the registry password in the inventory
          ansible.builtin.command:
            argv:
              - sops
              - --config
              - "{{ control_dir }}/.sops.yaml"
              - set
              - --value-stdin
              - "{{ inventory_secrets }}"
              - '["registry_password"]'
            stdin: "{{ rotate_password | to_json }}"
          changed_when: true
          no_log: true

        - name: Read back the registry password
          ansible.builtin.command:
            argv:
              - sops
              - --decrypt
              - --extract
              - '["registry_password"]'
              - "{{ inventory_secrets }}"
          register: rotate_registry_readback
          changed_when: false
          check_mode: false
          no_log: true

        - name: Fail closed when the registry password does not round-trip
          ansible.builtin.assert:
            that:
              - rotate_registry_readback.stdout | trim == rotate_password
            fail_msg: >-
              the registry password in the inventory does not decrypt to the
              value that was written.
            quiet: true
          no_log: true

        - name: Report the registry follow-up
          ansible.builtin.debug:
            msg: >-
              Inventory rotated. Re-apply the registry with
              `playbooks/registry/registry.yaml`, rerun
              `playbooks/registry/secrets/derive.yaml`,
              `playbooks/jenkins/secrets/derive.yaml`, and
              `playbooks/jenkins/images.yaml`, then restart Jenkins if its
              registry environment changed.
