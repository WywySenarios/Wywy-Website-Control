---
- name: Populate the registry password
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars_files:
    - ../../../vars/secrets.yaml

  vars:
    inventory_secrets: >-
      {{ control_dir }}/ansible/inventory/{{ wywy_env }}/group_vars/all.sops.yaml

  tasks:
    - name: Check the inventory secrets file
      ansible.builtin.stat:
        path: "{{ inventory_secrets }}"
      register: registry_inventory_stat

    - name: Fail when the inventory secrets file is missing
      ansible.builtin.assert:
        that:
          - registry_inventory_stat.stat.exists
        fail_msg: >-
          {{ inventory_secrets }} is missing. Create the environment inventory
          secrets first; this playbook only adds the registry_password key.
        quiet: true

    - name: Read the existing registry password
      ansible.builtin.command:
        argv:
          - sops
          - --decrypt
          - --extract
          - '["registry_password"]'
          - "{{ inventory_secrets }}"
      register: registry_read
      changed_when: false
      failed_when: false
      check_mode: false
      no_log: true

    - name: Generate the registry password
      ansible.builtin.set_fact:
        registry_password_new: >-
          {{ lookup('pipe', 'openssl rand -base64 32') | trim }}
      when: registry_read.rc != 0
      no_log: true

    - name: Store the registry password
      ansible.builtin.command:
        argv:
          - sops
          - --config
          - "{{ control_dir }}/.sops.yaml"
          - set
          - --value-stdin
          - "{{ inventory_secrets }}"
          - '["registry_password"]'
        stdin: "{{ registry_password_new | to_json }}"
      when: registry_read.rc != 0
      changed_when: true
      no_log: true

    - name: Read back the registry password
      ansible.builtin.command:
        argv:
          - sops
          - --decrypt
          - --extract
          - '["registry_password"]'
          - "{{ inventory_secrets }}"
      register: registry_readback
      when: registry_read.rc != 0
      changed_when: false
      check_mode: false
      no_log: true

    - name: Fail closed when the registry password does not round-trip
      ansible.builtin.assert:
        that:
          - registry_readback.stdout | trim == registry_password_new
        fail_msg: >-
          the registry password in the inventory does not decrypt to the value
          that was written.
        quiet: true
      when: registry_read.rc != 0
      no_log: true
