---
# Derive: image-updater-registry, master-database/regcred from registry_password

- name: Generate derived registry secrets
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars_files:
    - ../../../vars/secrets.yaml

  vars:
    registry_internal_host: registry.internal:5000

  tasks:
    - name: Validate the registry password
      ansible.builtin.assert:
        that:
          - registry_password is defined
          - registry_password | length > 0
        fail_msg: registry_password is not resolvable from the inventory.
        quiet: true
      no_log: true

    - name: Ensure the secret directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0775"
      loop:
        - "{{ image_updater_secrets_dir }}"
        - "{{ master_database_secrets_dir }}"

    - name: Build the registry auth value
      ansible.builtin.set_fact:
        registry_auth: "{{ ('admin:' ~ registry_password) | b64encode }}"
      no_log: true

    - name: Store the image-updater registry auth
      ansible.builtin.include_role:
        name: sops_secret
      vars:
        sops_secret_target: >-
          {{ image_updater_secrets_dir }}/image-updater-registry.sops.yaml
        sops_secret_format: yaml
        sops_secret_plaintext: >-
          {{ {'apiVersion': 'v1',
              'kind': 'Secret',
              'metadata': {'name': 'image-updater-registry',
                           'namespace': 'argocd'},
              'type': 'Opaque',
              'stringData': {'auth': registry_auth}}
             | to_nice_yaml }}
        sops_secret_expected: >-
          {{ {'apiVersion': 'v1',
              'kind': 'Secret',
              'metadata': {'name': 'image-updater-registry',
                           'namespace': 'argocd'},
              'type': 'Opaque',
              'stringData': {'auth': registry_auth}}
             | to_json }}
      no_log: true

    - name: Build the master-database docker config
      ansible.builtin.set_fact:
        master_database_dockerconfig: >-
          {{ lookup('template',
                    playbook_dir ~ '/templates/master-database-dockerconfig.yaml.j2')
             | from_yaml | to_json }}
      no_log: true

    - name: Store the master-database registry credentials
      ansible.builtin.include_role:
        name: sops_secret
      vars:
        sops_secret_target: >-
          {{ master_database_secrets_dir }}/regcred.sops.yaml
        sops_secret_format: yaml
        sops_secret_plaintext: >-
          {{ {'apiVersion': 'v1',
              'kind': 'Secret',
              'metadata': {'name': 'regcred',
                           'namespace': 'master-database'},
              'type': 'kubernetes.io/dockerconfigjson',
              'stringData': {'.dockerconfigjson': master_database_dockerconfig}}
             | to_nice_yaml }}
        sops_secret_expected: >-
          {{ {'apiVersion': 'v1',
              'kind': 'Secret',
              'metadata': {'name': 'regcred',
                           'namespace': 'master-database'},
              'type': 'kubernetes.io/dockerconfigjson',
              'stringData': {'.dockerconfigjson': master_database_dockerconfig}}
             | to_json }}
      no_log: true
