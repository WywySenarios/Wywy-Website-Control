---
# Populate: internal-ca
#
# Additional steps:
#   1. Reinitialize Argo CD.
#   2. Restart Argo CD.
#   3. Reinitialize the registry.
#   4. Reinitialize k8s control planes.
#   5. Reinitialize k8s workers.

- name: Populate the internal CA and derived copies
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars_files:
    - ../../../vars/secrets.yaml

  vars:
    pki_ca_secret: "{{ control_dir }}/secrets/{{ wywy_env }}/internal-ca.sops"
    pki_jenkins_secrets_dir: "{{ control_dir }}/k8s/{{ wywy_env }}/jenkins/secrets"
    pki_image_updater_secrets_dir: "{{ control_dir }}/k8s/{{ wywy_env }}/image-updater/secrets"
    internal_ca_env: "{{ wywy_env }}"
    internal_ca_control_dir: "{{ control_dir }}"
    internal_ca_secret: "{{ pki_ca_secret }}"
    internal_ca_force: false

  pre_tasks:
    - name: Refuse check mode
      ansible.builtin.assert:
        that:
          - not ansible_check_mode
        fail_msg: --check is not supported; run without --check.
        quiet: true
      tags: always

    - name: Refuse to replace an existing CA from populate
      ansible.builtin.assert:
        that:
          - not (internal_ca_force | bool)
        fail_msg: >-
          populate only creates a missing CA; use
          playbooks/pki/secrets/rotate.yaml --tags internal-ca only for a
          compromise replacement.
        quiet: true

  roles:
    - internal_ca

  tasks:
    - name: Write missing derived CA copies
      ansible.builtin.include_role:
        name: internal_ca
        tasks_from: derive-ca-copies
      vars:
        internal_ca_derive_force: false
