---
# Rotate: internal-ca
#
# Additional steps:
#   1. Reinitialize Argo CD.
#   2. Restart Argo CD.
#   3. Reinitialize the registry.
#   4. Reinitialize k8s control planes.
#   5. Reinitialize k8s workers.

- name: Rotate the internal CA and derived copies
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars_files:
    - ../../../vars/secrets.yaml

  vars:
    valid_rotation_tags:
      - internal-ca
    pki_ca_secret: "{{ control_dir }}/secrets/{{ wywy_env }}/internal-ca.sops"
    pki_jenkins_secrets_dir: "{{ control_dir }}/k8s/{{ wywy_env }}/jenkins/secrets"
    pki_image_updater_secrets_dir: "{{ control_dir }}/k8s/{{ wywy_env }}/image-updater/secrets"
    internal_ca_env: "{{ wywy_env }}"
    internal_ca_control_dir: "{{ control_dir }}"
    internal_ca_secret: "{{ pki_ca_secret }}"
    internal_ca_force: true

  tasks:
    - name: Refuse check mode
      ansible.builtin.assert:
        that:
          - not ansible_check_mode
        fail_msg: --check is not supported; run without --check.
        quiet: true
      tags: always

    - name: Validate the rotation tag
      ansible.builtin.include_role:
        name: sops_secret
        tasks_from: validate-rotation-tag
      tags: always

    - name: Rotate the internal CA and derived copies
      tags: internal-ca
      block:
        - name: Check for an existing internal CA
          ansible.builtin.stat:
            path: "{{ pki_ca_secret }}"
          register: internal_ca_rotate_before_stat

        - name: Require an existing internal CA to rotate
          ansible.builtin.assert:
            that:
              - internal_ca_rotate_before_stat.stat.exists
            fail_msg: >-
              no internal CA exists to rotate; run
              playbooks/pki/secrets/populate.yaml instead.
            quiet: true

        - name: Read the existing internal CA certificate
          ansible.builtin.command:
            argv:
              - sops
              - --decrypt
              - --output-type
              - binary
              - "{{ pki_ca_secret }}"
          when: internal_ca_rotate_before_stat.stat.exists
          register: internal_ca_rotate_before_read
          changed_when: false
          check_mode: false
          no_log: true

        - name: Record the existing internal CA certificate
          ansible.builtin.set_fact:
            internal_ca_rotate_before_cert: ""
          no_log: true

        - name: Record the existing internal CA certificate
          ansible.builtin.set_fact:
            internal_ca_rotate_before_cert: >-
              {{ (internal_ca_rotate_before_read.stdout | from_yaml).cert }}
          when: internal_ca_rotate_before_stat.stat.exists
          no_log: true

        - name: Generate a new internal CA
          ansible.builtin.include_role:
            name: internal_ca

        - name: Read the new internal CA certificate
          ansible.builtin.command:
            argv:
              - sops
              - --decrypt
              - --output-type
              - binary
              - "{{ pki_ca_secret }}"
          register: internal_ca_rotate_after_read
          changed_when: false
          check_mode: false
          no_log: true

        - name: Record the new internal CA certificate
          ansible.builtin.set_fact:
            internal_ca_rotate_after_cert: >-
              {{ (internal_ca_rotate_after_read.stdout | from_yaml).cert }}
          no_log: true

        - name: Require the CA certificate to change
          ansible.builtin.assert:
            that:
              - internal_ca_rotate_after_cert != internal_ca_rotate_before_cert
            fail_msg: >-
              the internal CA was not replaced; refusing to report a
              successful rotation.
            quiet: true

        - name: Write the derived CA copies
          ansible.builtin.include_role:
            name: internal_ca
            tasks_from: derive-ca-copies
          vars:
            internal_ca_derive_force: true

        - name: Report the internal CA rotation follow-up
          ansible.builtin.debug:
            msg: |
              {% if wywy_env == 'prod' %}Prod: stop after step 6; steps 1-3 and 7 do not apply yet.
              {% endif %}1. Reissue the Argo CD certificate:
                 uv run --directory ansible wywy-ansible --{{ wywy_env }} playbooks/argocd/tls.yaml
              2. Reissue the registry certificate and operator Docker trust:
                 uv run --directory ansible wywy-ansible --{{ wywy_env }} playbooks/registry/registry.yaml
              3. Refresh the registry VM system trust:
                 uv run --directory ansible wywy-ansible --{{ wywy_env }} playbooks/registry/proxmox-vm.yaml --limit registry
              4. Refresh Kubernetes node containerd trust:
                 uv run --directory ansible wywy-ansible --{{ wywy_env }} playbooks/k8s/control-plane/bootstrap.yaml
                 uv run --directory ansible wywy-ansible --{{ wywy_env }} playbooks/k8s/workers/workers.yaml
              5. Verify the new CA decrypts:
                 sops -d --output-type binary secrets/{{ wywy_env }}/internal-ca.sops >/dev/null
              {% if wywy_env == 'prod' %}6. Commit and push secrets/{{ wywy_env }}/internal-ca.sops
                 and k8s/{{ wywy_env }}/jenkins/secrets/jenkins-registry-ca.sops.yaml.
              {% else %}6. Commit and push secrets/{{ wywy_env }}/internal-ca.sops, both derived CA copies, and the Argo CD TLS secret.
              {% endif %}7. Sync the Argo CD TLS Application: argocd app sync {{ wywy_env }}-argocd-tls
              8. Restart consumers of the updated CA copies:
                 kubectl -n jenkins rollout restart deployment/jenkins
                 kubectl -n argocd rollout restart deployment/argocd-image-updater
