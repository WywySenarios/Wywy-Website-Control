---
- name: Produce the internal root CA and its derived copies
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    control_dir: "{{ ansible_config_file | dirname | dirname }}"
    wywy_env: >-
      {{ ansible_inventory_sources
         | select('search', '/(dev|prod)$')
         | map('basename')
         | first }}
    pki_ca_secret: "{{ control_dir }}/secrets/{{ wywy_env }}/internal-ca.sops"
    pki_jenkins_secrets_dir: "{{ control_dir }}/k8s/{{ wywy_env }}/jenkins/secrets"
    pki_image_updater_secrets_dir: "{{ control_dir }}/k8s/{{ wywy_env }}/image-updater/secrets"

  roles:
    - internal_ca

  tasks:
    - name: Read the internal CA bundle
      ansible.builtin.command:
        argv:
          - sops
          - --decrypt
          - --output-type
          - binary
          - "{{ pki_ca_secret }}"
      register: pki_ca_read
      changed_when: false
      check_mode: false
      no_log: true

    - name: Derive the internal CA certificate
      ansible.builtin.set_fact:
        pki_ca_cert: "{{ (pki_ca_read.stdout | from_yaml).cert }}"
      no_log: true

    - name: Ensure the CA copy directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0775"
      loop:
        - "{{ pki_jenkins_secrets_dir }}"
        - "{{ pki_image_updater_secrets_dir }}"

    - name: Store the Jenkins registry CA
      ansible.builtin.include_role:
        name: sops_secret
      vars:
        sops_secret_target: >-
          {{ pki_jenkins_secrets_dir }}/jenkins-registry-ca.sops.yaml
        sops_secret_format: yaml
        sops_secret_plaintext: >-
          {{ {'apiVersion': 'v1',
              'kind': 'ConfigMap',
              'metadata': {'name': 'jenkins-registry-ca',
                           'namespace': 'jenkins'},
              'data': {'ca.crt': pki_ca_cert}}
             | to_nice_yaml }}
        sops_secret_expected: >-
          {{ {'apiVersion': 'v1',
              'kind': 'ConfigMap',
              'metadata': {'name': 'jenkins-registry-ca',
                           'namespace': 'jenkins'},
              'data': {'ca.crt': pki_ca_cert}}
             | to_json }}
      no_log: true

    - name: Store the image-updater registry CA
      ansible.builtin.include_role:
        name: sops_secret
      vars:
        sops_secret_target: >-
          {{ pki_image_updater_secrets_dir }}/registry-ca.sops.yaml
        sops_secret_format: yaml
        sops_secret_plaintext: >-
          {{ {'apiVersion': 'v1',
              'kind': 'Secret',
              'metadata': {'name': 'registry-ca',
                           'namespace': 'argocd'},
              'type': 'Opaque',
              'stringData': {'ca.crt': pki_ca_cert}}
             | to_nice_yaml }}
        sops_secret_expected: >-
          {{ {'apiVersion': 'v1',
              'kind': 'Secret',
              'metadata': {'name': 'registry-ca',
                           'namespace': 'argocd'},
              'type': 'Opaque',
              'stringData': {'ca.crt': pki_ca_cert}}
             | to_json }}
      no_log: true
