---
- name: Populate the Argo CD admin password
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars_files:
    - ../../../vars/secrets.yaml

  vars:
    sops_secret_verify: false

  tasks:
    - name: Ensure the secrets directory exists
      ansible.builtin.file:
        path: "{{ secrets_dir }}"
        state: directory
        mode: "0700"

    - name: Check the Argo CD admin secret
      ansible.builtin.stat:
        path: "{{ secrets_dir }}/argocd-admin.sops"
      register: populate_argocd_admin

    - name: Generate the Argo CD admin password
      ansible.builtin.set_fact:
        populate_argocd_admin_password: >-
          {{ lookup('pipe', 'openssl rand -base64 32') | trim }}
      when: not populate_argocd_admin.stat.exists
      no_log: true

    - name: Store the Argo CD admin password
      ansible.builtin.include_role:
        name: sops_secret
      vars:
        sops_secret_target: "{{ secrets_dir }}/argocd-admin.sops"
        sops_secret_format: json
        sops_secret_plaintext: >-
          {{ {'data': populate_argocd_admin_password} | to_json }}
        sops_secret_expected: >-
          {{ {'data': populate_argocd_admin_password} | to_json }}
      when: not populate_argocd_admin.stat.exists
      no_log: true
