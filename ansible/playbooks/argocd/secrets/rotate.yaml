---
# Rotate: argocd-admin
#
# Additional steps: Apply with `playbooks/argocd/argocd.yaml`.

- name: Rotate the Argo CD admin password
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars_files:
    - ../../../vars/secrets.yaml

  vars:
    valid_rotation_tags:
      - argocd-admin

  tasks:
    - name: Validate the rotation tag
      ansible.builtin.include_role:
        name: sops_secret
        tasks_from: validate-rotation-tag
      tags: always

    - name: Rotate the Argo CD admin password
      tags: argocd-admin
      block:
        - name: Generate the Argo CD admin password
          ansible.builtin.set_fact:
            rotate_password: >-
              {{ lookup('pipe', 'openssl rand -base64 32') | trim }}
          no_log: true

        - name: Store the Argo CD admin password
          ansible.builtin.include_role:
            name: sops_secret
          vars:
            sops_secret_target: "{{ secrets_dir }}/argocd-admin.sops"
            sops_secret_format: binary
            sops_secret_plaintext: "{{ rotate_password }}"
            sops_secret_expected: "{{ rotate_password }}"
          no_log: true

        - name: Report the Argo CD follow-up
          ansible.builtin.debug:
            msg: >-
              Store rotated. Apply it with `playbooks/argocd/argocd.yaml`.
