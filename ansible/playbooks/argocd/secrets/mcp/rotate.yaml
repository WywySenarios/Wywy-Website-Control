---
# Rotate: argocd-mcp

- name: Rotate the Argo CD MCP server credentials
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars_files:
    - ../../../../vars/secrets.yaml

  vars:
    valid_rotation_tags:
      - argocd-mcp
    argocd_mcp_token_secret: >-
      {{ control_dir }}/k8s/{{ wywy_env }}/argocd-mcp/secrets/argocd-mcp.sops.yaml

  tasks:
    - name: Validate the rotation tag
      ansible.builtin.include_role:
        name: sops_secret
        tasks_from: validate-rotation-tag
      tags: always

    - name: Rotate the MCP credentials
      tags: argocd-mcp
      block:
        - name: Mint and store the MCP credentials
          ansible.builtin.include_role:
            name: argocd_mcp_token
          vars:
            argocd_mcp_token_force_write: true

        - name: Restart the MCP deployment
          ansible.builtin.include_role:
            name: argocd_mcp_token
            tasks_from: restart

        - name: Report the MCP follow-up
          ansible.builtin.debug:
            msg: >-
              Credentials rotated and the MCP deployment restarted. Update MCP
              clients with the new MCP_AUTH_TOKEN from
              {{ argocd_mcp_token_secret }}.
