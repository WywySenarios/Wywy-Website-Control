---
# Populate: Argo CD MCP server credentials
#
# ArgoCD must already be online.
#
# Rotate with playbooks/argocd/secrets/mcp/rotate.yaml.

- name: Populate the Argo CD MCP server credentials
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars_files:
    - ../../../../vars/secrets.yaml

  tasks:
    - name: Populate the MCP credentials
      ansible.builtin.include_role:
        name: argocd_mcp_token
