---
# Populate: proxmox root passwords
#
# Not rotatable: this playbook adds missing per-node root passwords.
# Existing passwords are not replaced.
- name: Populate the PVE root-password store
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    control_dir: "{{ ansible_config_file | dirname | dirname }}"
    wywy_env: "{{ (ansible_inventory_sources | select('search', '/(dev|prod)$') | map('basename') | first) }}"

  roles:
    - role: proxmox_root_passwords
      vars:
        proxmox_root_passwords_label: PVE
        proxmox_root_passwords_secret: "{{ control_dir }}/secrets/{{ wywy_env }}/proxmox/root.sops.yaml"
        proxmox_root_passwords_hosts: "{{ groups['proxmox'] | default([]) | sort }}"

- name: Populate the PBS root-password store
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    control_dir: "{{ ansible_config_file | dirname | dirname }}"
    wywy_env: "{{ (ansible_inventory_sources | select('search', '/(dev|prod)$') | map('basename') | first) }}"

  roles:
    - role: proxmox_root_passwords
      vars:
        proxmox_root_passwords_label: PBS
        proxmox_root_passwords_secret: "{{ control_dir }}/secrets/{{ wywy_env }}/proxmox-backup/root.sops.yaml"
        proxmox_root_passwords_hosts: "{{ groups['proxmox_backup'] | default([]) | sort }}"
