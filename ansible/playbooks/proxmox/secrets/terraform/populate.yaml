---
# Populate: Proxmox Terraform API token
#
# Adds the Terraform API token when missing. It does not replace an existing
# token. Rotate with playbooks/proxmox/secrets/terraform/rotate.yaml.

- name: Populate the Proxmox Terraform API token
  hosts: proxmox_cluster_leader
  gather_facts: false
  become: false

  vars_files:
    - ../../../../vars/secrets.yaml

  vars:
    proxmox_terraform_token_secret_path: "{{ secrets_dir }}/proxmox/terraform.sops"

  tasks:
    - name: Check the Terraform token state
      ansible.builtin.include_role:
        name: proxmox_terraform_token
        tasks_from: check

    - name: Assert the token secret state
      ansible.builtin.include_role:
        name: proxmox_terraform_token
        tasks_from: assert-secret

    - name: Create the Terraform token
      when: not proxmox_terraform_token_exists | bool
      ansible.builtin.include_role:
        name: proxmox_terraform_token
        tasks_from: create

- name: Store the Proxmox Terraform API token
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars_files:
    - ../../../../vars/secrets.yaml

  vars:
    proxmox_terraform_token_secret_path: "{{ secrets_dir }}/proxmox/terraform.sops"
    proxmox_terraform_token_full: >-
      {{ hostvars[groups['proxmox_cluster_leader'][0]].proxmox_terraform_token_full
         | default('') }}

  tasks:
    - name: Store the Terraform token in sops
      when: proxmox_terraform_token_full | length > 0
      no_log: true
      ansible.builtin.include_role:
        name: sops_secret
      vars:
        sops_secret_target: "{{ proxmox_terraform_token_secret_path }}"
        sops_secret_format: binary
        sops_secret_plaintext: "{{ proxmox_terraform_token_full }}"
        sops_secret_expected: "{{ proxmox_terraform_token_full }}"
