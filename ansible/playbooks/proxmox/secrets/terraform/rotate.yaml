---
# Rotate: terraform-token
#
# Additional steps: N/A

- name: Rotate the Proxmox Terraform API token
  hosts: proxmox_cluster_leader
  gather_facts: false
  become: false

  vars_files:
    - ../../../../vars/secrets.yaml

  vars:
    valid_rotation_tags:
      - terraform-token
    proxmox_terraform_token_secret_path: "{{ secrets_dir }}/proxmox/terraform.sops"

  tasks:
    - name: Validate the rotation tag
      ansible.builtin.include_role:
        name: sops_secret
        tasks_from: validate-rotation-tag
      tags: always

    - name: Rotate the Terraform token
      tags: terraform-token
      block:
        - name: Check the Terraform token state
          ansible.builtin.include_role:
            name: proxmox_terraform_token
            tasks_from: check

        - name: Revoke the existing token
          ansible.builtin.include_role:
            name: proxmox_terraform_token
            tasks_from: revoke

        - name: Create the new token
          ansible.builtin.include_role:
            name: proxmox_terraform_token
            tasks_from: create

- name: Store the rotated Proxmox Terraform API token
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars_files:
    - ../../../../vars/secrets.yaml

  vars:
    proxmox_terraform_token_secret_path: "{{ secrets_dir }}/proxmox/terraform.sops"
    proxmox_terraform_token_full: >-
      {{ hostvars[groups['proxmox_cluster_leader'][0]].proxmox_terraform_token_full
         | default('') }}

  tasks:
    - name: Store the rotated token in sops
      when: proxmox_terraform_token_full | length > 0
      no_log: true
      ansible.builtin.include_role:
        name: sops_secret
      vars:
        sops_secret_target: "{{ proxmox_terraform_token_secret_path }}"
        sops_secret_format: binary
        sops_secret_plaintext: "{{ proxmox_terraform_token_full }}"
        sops_secret_expected: "{{ proxmox_terraform_token_full }}"

    - name: Report the Terraform follow-up
      ansible.builtin.debug:
        msg: >-
          Token rotated. Terraform reads the token from
          {{ proxmox_terraform_token_secret_path }} on its next run.
