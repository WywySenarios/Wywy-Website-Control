---
# Create missing entries in the PVE root password secret (i.e. root.sops.yaml inside this repository).
- name: Maintain the PVE root-password store
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    control_dir: "{{ ansible_config_file | dirname | dirname }}"
    wywy_env: "{{ ansible_inventory_sources | first | basename }}"
    proxmox_root_secret: "{{ control_dir }}/secrets/{{ wywy_env }}/proxmox/root.sops.yaml"
    proxmox_group_hosts: "{{ groups['proxmox'] | default([]) | sort }}"

  tasks:
    - name: Require a recognised environment and a non-empty proxmox group
      ansible.builtin.assert:
        that:
          - wywy_env in ['dev', 'prod']
          - proxmox_group_hosts | length > 0
        fail_msg: >-
          the selected inventory must be dev or prod and must define a
          non-empty proxmox group.
        quiet: true

    - name: Require each role tag to select one node from the proxmox pool
      ansible.builtin.assert:
        that:
          - groups['db_pve'] | default([]) | length == 1
          - groups['files_pve'] | default([]) | length == 1
          - groups['registry_pve'] | default([]) | length == 1
          - groups['db_pve'] | default([]) | difference(proxmox_group_hosts) | length == 0
          - groups['files_pve'] | default([]) | difference(proxmox_group_hosts) | length == 0
          - groups['registry_pve'] | default([]) | difference(proxmox_group_hosts) | length == 0
        fail_msg: >-
          db_pve, files_pve, and registry_pve must each select exactly one
          physical node in groups['proxmox']; role tags may overlap.
        quiet: true

    - name: Create the proxmox secret directory
      ansible.builtin.file:
        path: "{{ proxmox_root_secret | dirname }}"
        state: directory
        mode: "0700"

    - name: Check for an existing root-password store
      ansible.builtin.stat:
        path: "{{ proxmox_root_secret }}"
      register: proxmox_root_store

    - name: Read the existing root-password store
      ansible.builtin.command:
        argv:
          - sops
          - --decrypt
          - --output-type
          - yaml
          - "{{ proxmox_root_secret }}"
      when: proxmox_root_store.stat.exists
      changed_when: false
      check_mode: false
      no_log: true
      register: proxmox_root_store_read

    - name: Parse the existing store
      ansible.builtin.set_fact:
        proxmox_root_existing: >-
          {{ proxmox_root_store_read.stdout | from_yaml
             if proxmox_root_store.stat.exists else {} }}
      no_log: true

    - name: Fail closed when the existing store is not a mapping
      ansible.builtin.assert:
        that:
          - proxmox_root_existing is mapping
        fail_msg: >-
          {{ proxmox_root_secret }} decrypted but is not a hostname-to-password
          mapping; refusing to regenerate it.
        quiet: true
      when: proxmox_root_store.stat.exists

    - name: Determine which PVE nodes are missing a password
      ansible.builtin.set_fact:
        proxmox_root_missing: >-
          {{ proxmox_group_hosts
             | difference(proxmox_root_existing.keys() | list) }}

    - name: Seed the desired map from the existing store
      ansible.builtin.set_fact:
        proxmox_root_desired: "{{ proxmox_root_existing }}"
      no_log: true

    - name: Add a fresh random password for each missing PVE node
      ansible.builtin.set_fact:
        proxmox_root_desired: >-
          {{ proxmox_root_desired
             | combine({item: lookup('pipe', 'openssl rand -base64 36') | trim}) }}
      loop: "{{ proxmox_root_missing }}"
      no_log: true

    - name: Re-encrypt and install the store when a host was added
      when: proxmox_root_missing | length > 0
      block:
        - name: Create a private staging directory beside the store
          ansible.builtin.tempfile:
            state: directory
            path: "{{ proxmox_root_secret | dirname }}"
            prefix: ".root-passwords."
          register: proxmox_root_staging

        - name: Write the merged store as plaintext in the staging directory
          ansible.builtin.copy:
            content: >-
              {{ proxmox_root_desired | to_nice_yaml(indent=2, sort_keys=true) }}
            dest: "{{ proxmox_root_staging.path }}/root.yaml"
            mode: "0600"
          no_log: true

        - name: Encrypt the merged store
          ansible.builtin.shell:
            cmd: |
              set -euo pipefail
              sops --encrypt \
                --config "{{ control_dir }}/.sops.yaml" \
                --filename-override "{{ proxmox_root_secret }}" \
                "{{ proxmox_root_staging.path }}/root.yaml" \
                > "{{ proxmox_root_staging.path }}/root.enc.yaml"
            executable: /bin/bash
          changed_when: true
          no_log: true

        - name: Restrict the staged ciphertext
          ansible.builtin.file:
            path: "{{ proxmox_root_staging.path }}/root.enc.yaml"
            mode: "0600"

        - name: Validate the staged ciphertext before installing it
          ansible.builtin.command:
            argv:
              - sops
              - --decrypt
              - --output-type
              - yaml
              - "{{ proxmox_root_staging.path }}/root.enc.yaml"
          changed_when: false
          check_mode: false
          no_log: true
          register: proxmox_root_staged_read

        - name: Verify the staged ciphertext matches the desired store
          ansible.builtin.assert:
            that:
              - (proxmox_root_staged_read.stdout | from_yaml) == proxmox_root_desired
            fail_msg: >-
              the staged ciphertext does not decrypt to the desired store;
              refusing to replace {{ proxmox_root_secret }}.
            quiet: true
          no_log: true

        - name: Install the re-encrypted store atomically
          ansible.builtin.command:
            argv:
              - mv
              - "{{ proxmox_root_staging.path }}/root.enc.yaml"
              - "{{ proxmox_root_secret }}"
          changed_when: true

      always:
        - name: Remove the staging directory
          ansible.builtin.file:
            path: "{{ proxmox_root_staging.path }}"
            state: absent
          when: proxmox_root_staging.path is defined

    - name: Validate that the installed store decrypts
      ansible.builtin.command:
        argv:
          - sops
          - --decrypt
          - --output-type
          - yaml
          - "{{ proxmox_root_secret }}"
      changed_when: false
      check_mode: false
      no_log: true
      register: proxmox_root_validated

    - name: Parse the validated store
      ansible.builtin.set_fact:
        proxmox_root_stored: "{{ proxmox_root_validated.stdout | from_yaml }}"
      no_log: true

    - name: Verify exactly one unique, non-empty password per PVE node
      ansible.builtin.assert:
        that:
          - proxmox_root_stored is mapping
          - proxmox_root_stored.keys() | list | sort == proxmox_group_hosts
          - proxmox_root_stored.values() | list | select('string') | list | length
            == proxmox_group_hosts | length
          - proxmox_root_stored.values() | list | unique | length
            == proxmox_group_hosts | length
          - proxmox_root_stored.values() | list | select('equalto', '') | list | length
            == 0
        fail_msg: >-
          {{ proxmox_root_secret }} must contain exactly one unique, non-empty
          password for every node in groups['proxmox'].
        quiet: true
