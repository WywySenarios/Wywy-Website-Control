---
# Rotate: postgres-password
#
# Additional steps:
#   postgres-password: run `playbooks/db/seed.yaml`

- name: Rotate one database server secret
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars_files:
    - ../../../vars/secrets.yaml

  vars:
    valid_rotation_tags:
      - postgres-password

  tasks:
    - name: Validate the rotation tag
      ansible.builtin.include_role:
        name: sops_secret
        tasks_from: validate-rotation-tag
      tags: always

    - name: Rotate the Postgres superuser password
      tags: postgres-password
      block:
        - name: Generate the Postgres superuser password
          ansible.builtin.set_fact:
            rotate_password: >-
              {{ lookup('pipe', 'openssl rand -base64 32') | trim }}
          no_log: true

        - name: Store the Postgres superuser password for Ansible
          ansible.builtin.include_role:
            name: sops_secret
          vars:
            sops_secret_target: "{{ secrets_dir }}/postgres-password.sops"
            sops_secret_format: json
            sops_secret_plaintext: >-
              {{ {'data': rotate_password} | to_json }}
            sops_secret_expected: >-
              {{ {'data': rotate_password} | to_json }}
          no_log: true

        - name: Store the Postgres superuser password for Kubernetes
          ansible.builtin.include_role:
            name: sops_secret
          vars:
            sops_secret_target: >-
              {{ master_database_secrets_dir }}/postgres-password.sops.yaml
            sops_secret_format: yaml
            sops_secret_plaintext: >-
              {{ {'apiVersion': 'v1',
                  'kind': 'Secret',
                  'metadata': {'name': 'postgres-password',
                               'namespace': 'master-database'},
                  'type': 'Opaque',
                  'stringData': {'password': rotate_password}}
                 | to_nice_yaml }}
            sops_secret_expected: >-
              {{ {'apiVersion': 'v1',
                  'kind': 'Secret',
                  'metadata': {'name': 'postgres-password',
                               'namespace': 'master-database'},
                  'type': 'Opaque',
                  'stringData': {'password': rotate_password}} | to_json }}
          no_log: true

        - name: Report the Postgres superuser follow-up
          ansible.builtin.debug:
            msg: >-
              Store rotated. Apply it with `playbooks/db/seed.yaml`; restart
              the master-database workload only if it consumes the Kubernetes
              secret.
