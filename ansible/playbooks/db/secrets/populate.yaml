---
- name: Populate missing database server secrets
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars_files:
    - ../../../vars/secrets.yaml

  vars:
    populate_directories:
      - { path: "{{ secrets_dir }}", mode: "0700" }
      - { path: "{{ master_database_secrets_dir }}", mode: "0775" }

  tasks:
    - name: Ensure the database server secret directories exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        mode: "{{ item.mode }}"
      loop: "{{ populate_directories }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Check the Postgres superuser secret targets
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ secrets_dir }}/postgres-password.sops"
        - "{{ master_database_secrets_dir }}/postgres-password.sops.yaml"
      register: populate_postgres_stats

    - name: Read the existing Ansible Postgres password
      ansible.builtin.command:
        argv:
          - sops
          - --decrypt
          - --extract
          - '["data"]'
          - "{{ secrets_dir }}/postgres-password.sops"
      register: populate_postgres_ansible_read
      when: populate_postgres_stats.results[0].stat.exists
      changed_when: false
      check_mode: false
      no_log: true

    - name: Read the existing Kubernetes Postgres password
      ansible.builtin.command:
        argv:
          - sops
          - --decrypt
          - --extract
          - '["stringData"]["password"]'
          - "{{ master_database_secrets_dir }}/postgres-password.sops.yaml"
      register: populate_postgres_k8s_read
      when: populate_postgres_stats.results[1].stat.exists
      changed_when: false
      check_mode: false
      no_log: true

    - name: Select or generate the Postgres superuser password
      ansible.builtin.set_fact:
        populate_postgres_password: >-
          {{ (populate_postgres_ansible_read.stdout | default('') | trim)
             if populate_postgres_stats.results[0].stat.exists
             else ((populate_postgres_k8s_read.stdout | default('') | trim)
                   if populate_postgres_stats.results[1].stat.exists
                   else (lookup('pipe', 'openssl rand -base64 32') | trim)) }}
      when: >-
        (not populate_postgres_stats.results[0].stat.exists)
        or (not populate_postgres_stats.results[1].stat.exists)
      no_log: true

    - name: Store the Postgres superuser password for Ansible
      ansible.builtin.include_role:
        name: sops_secret
      vars:
        sops_secret_target: "{{ secrets_dir }}/postgres-password.sops"
        sops_secret_format: json
        sops_secret_plaintext: >-
          {{ {'data': populate_postgres_password} | to_json }}
        sops_secret_expected: >-
          {{ {'data': populate_postgres_password} | to_json }}
      when: not populate_postgres_stats.results[0].stat.exists
      no_log: true

    - name: Store the Postgres superuser password for Kubernetes
      ansible.builtin.include_role:
        name: sops_secret
      vars:
        sops_secret_target: "{{ master_database_secrets_dir }}/postgres-password.sops.yaml"
        sops_secret_format: yaml
        sops_secret_plaintext: >-
          {{ {'apiVersion': 'v1',
              'kind': 'Secret',
              'metadata': {'name': 'postgres-password',
                           'namespace': 'master-database'},
              'type': 'Opaque',
              'stringData': {'password': populate_postgres_password}}
             | to_nice_yaml }}
        sops_secret_expected: >-
          {{ {'apiVersion': 'v1',
              'kind': 'Secret',
              'metadata': {'name': 'postgres-password',
                           'namespace': 'master-database'},
              'type': 'Opaque',
              'stringData': {'password': populate_postgres_password}}
             | to_json }}
      when: not populate_postgres_stats.results[1].stat.exists
      no_log: true
