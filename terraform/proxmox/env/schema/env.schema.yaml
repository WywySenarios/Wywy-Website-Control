$schema: "https://json-schema.org/draft/2020-12/schema"
title: Proxmox environment overrides
description: >-
  Per-environment values layered over the base definitions. Every entry names
  the Proxmox node that hosts it.
type: object
additionalProperties: false
required:
  - ssh_public_keys
properties:
  ssh_public_keys:
    type: array
    minItems: 1
    items:
      type: string
      pattern: "^ssh-"
  registry_template:
    $ref: "#/$defs/template_override"
  registry_vm:
    $ref: "#/$defs/vm_override"
  database_template:
    $ref: "#/$defs/template_override"
  database_vm:
    $ref: "#/$defs/vm_override"
  files_template:
    $ref: "#/$defs/template_override"
  files_vm:
    $ref: "#/$defs/vm_override"
  k8s_worker_templates:
    $ref: "#/$defs/k8s_templates_override"
  k8s_worker_vms:
    $ref: "#/$defs/k8s_vms_override"
  k8s_control_plane_templates:
    $ref: "#/$defs/k8s_templates_override"
  k8s_control_plane_vms:
    $ref: "#/$defs/k8s_vms_override"
$defs:
  node_name:
    type: string
    pattern: "^[a-z][a-z0-9-]*$"
  ipv4_address:
    type: string
    pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}$'
  template_override:
    type: object
    additionalProperties: false
    required:
      - node_name
    properties:
      node_name:
        $ref: "#/$defs/node_name"
      disk_size_gb:
        type: integer
        minimum: 1
      memory_mb:
        type: integer
        minimum: 1
      cores:
        type: integer
        minimum: 1
      cpu_type:
        type: string
        minLength: 1
  vm_override:
    type: object
    additionalProperties: false
    required:
      - node_name
    properties:
      node_name:
        $ref: "#/$defs/node_name"
      disk_size_gb:
        type: integer
        minimum: 1
      data_disk_size_gb:
        type: integer
        minimum: 1
      ipv4_address:
        $ref: "#/$defs/ipv4_address"
  k8s_template_override:
    type: object
    additionalProperties: false
    required:
      - node_name
    properties:
      node_name:
        $ref: "#/$defs/node_name"
      disk_size_gb:
        type: integer
        minimum: 1
      memory_mb:
        type: integer
        minimum: 1
      cores:
        type: integer
        minimum: 1
      cpu_type:
        type: string
        minLength: 1
  k8s_vm_override:
    type: object
    additionalProperties: false
    required:
      - node_name
    properties:
      node_name:
        $ref: "#/$defs/node_name"
      disk_size_gb:
        type: integer
        minimum: 1
      ipv4_address:
        $ref: "#/$defs/ipv4_address"
  k8s_templates_override:
    type: object
    propertyNames:
      pattern: "^k8s-(worker|control-plane)-[0-9]+$"
    additionalProperties:
      $ref: "#/$defs/k8s_template_override"
  k8s_vms_override:
    type: object
    propertyNames:
      pattern: "^k8s-(worker|control-plane)-[0-9]+$"
    additionalProperties:
      $ref: "#/$defs/k8s_vm_override"
