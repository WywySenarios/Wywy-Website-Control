$schema: "https://json-schema.org/draft/2020-12/schema"
title: Cloudflare environment contract
description: >-
  Public hostnames, Kubernetes namespaces, and origin services keyed by
  Cloudflare tunnel name.
type: object
additionalProperties: false
required:
  - public_hosts
properties:
  public_hosts:
    type: object
    minProperties: 1
    propertyNames:
      pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"
    additionalProperties:
      type: object
      additionalProperties: false
      required:
        - hostname
        - namespace
        - service
      properties:
        hostname:
          type: string
          pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$"
        namespace:
          type: string
          pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"
        service:
          type: string
          pattern: "^https?://[^ ]+$"
